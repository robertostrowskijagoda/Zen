name: zen
description: "Zen: a network of people who know each other, with no servers, ads or algorithm."
publish_to: 'none'

# The same number is in lib/src/app/app_version.dart (a test checks it).
version: 1.15.3+20

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  ffi: ^2.1.4
  file_picker: ^10.3.3
  flutter_riverpod: ^3.3.1
  crypto: ^3.0.6
  # BlueZ (Linux Bluetooth links, bluez_le.dart).
  dbus: ^0.7.15
  mime: ^2.1.0
  video_player: ^2.14.1
  # Linux has no video_player backend: UnsupportedVideoPlayer stands in.
  video_player_platform_interface: ^6.9.0
  video_player_win: ^3.3.1
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  qr_code_dart_scan: ^0.14.0
  # Its QR decoder, used directly for camera pictures on computers.
  zxing_lib: ^1.1.4
  record: ^7.1.2
  zstandard: ^1.5.0
  flutter_local_notifications: ^21.0.0
  flutter_foreground_task: ^9.2.1
  cryptography: ^2.9.0
  flutter_secure_storage: ^10.3.4
  local_auth: ^3.0.2
  system_tray: ^2.0.3
  window_manager: ^0.5.2
  # 1.5.0+: a prebuilt libwebrtc for Windows on ARM64 (windows-arm64).
  flutter_webrtc: ^1.5.2
  app_links: ^7.2.2
  image_picker: ^1.2.4
  # The own camera of the "Filmy" section (hold to record).
  camera: ^0.12.1
  # Its Windows backend (not endorsed by camera, so named here).
  camera_windows: ^0.2.6
  image: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# system_tray 2.0.3 pins uuid ^3; this lets the rest of the tree use uuid 4
# (system_tray only calls `const Uuid().v1()`, which uuid 4 keeps unchanged).
dependency_overrides:
  uuid: ^4.5.1

flutter:
  uses-material-design: true

  fonts:
    - family: Baloo 2
      fonts:
        - asset: assets/fonts/Baloo2-Variable.ttf
    - family: Hanken Grotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Variable.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
    - family: Space Mono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf
    # The words painted on pebbles (PebbleFont), Google Fonts under the SIL
    # Open Font License; each licence is next to its font.
    - family: Quicksand
      fonts:
        - asset: assets/fonts/pebbles/Quicksand-Variable.ttf
    - family: Indie Flower
      fonts:
        - asset: assets/fonts/pebbles/IndieFlower-Regular.ttf
    - family: Amatic SC
      fonts:
        - asset: assets/fonts/pebbles/AmaticSC-Bold.ttf
          weight: 700
    - family: Courgette
      fonts:
        - asset: assets/fonts/pebbles/Courgette-Regular.ttf
    - family: Comic Neue
      fonts:
        - asset: assets/fonts/pebbles/ComicNeue-Bold.ttf
          weight: 700
    - family: Bangers
      fonts:
        - asset: assets/fonts/pebbles/Bangers-Regular.ttf
    - family: Titan One
      fonts:
        - asset: assets/fonts/pebbles/TitanOne-Regular.ttf
    - family: Saira Stencil One
      fonts:
        - asset: assets/fonts/pebbles/SairaStencilOne-Regular.ttf
    - family: Righteous
      fonts:
        - asset: assets/fonts/pebbles/Righteous-Regular.ttf
    - family: Bungee
      fonts:
        - asset: assets/fonts/pebbles/Bungee-Regular.ttf
    - family: Abril Fatface
      fonts:
        - asset: assets/fonts/pebbles/AbrilFatface-Regular.ttf
    - family: Yeseva One
      fonts:
        - asset: assets/fonts/pebbles/YesevaOne-Regular.ttf
    - family: Alfa Slab One
      fonts:
        - asset: assets/fonts/pebbles/AlfaSlabOne-Regular.ttf

  assets:
    - assets/branding/
    # Translations of the Polish texts in the code (tool/i18n.dart).
    - assets/i18n/
    # Licenses of the Go bridge's modules (tool/go_licenses.dart) and fonts.
    - assets/licenses/go/
    - assets/licenses/fonts/
    # Native libraries and Zen's own assets (THIRD_PARTY_NOTICES.md), and
    # the additional terms of Zen's licence.
    - assets/licenses/native/
    - NOTICE
    # The terms and the privacy policy, read and accepted in the app.
    - docs/TERMS.md
    - docs/PRIVACY.md
    # Zen's own sounds (tool/sounds/generate_sounds.py).
    - assets/sounds/
