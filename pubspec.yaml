name: zen
description: "Zen: a network of people who know each other, with no servers, ads or algorithm."
publish_to: 'none'

# The same number is in lib/src/app/app_version.dart (a test checks it).
version: 1.11.0+11

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  ffi: ^2.1.4
  file_picker: ^10.3.3
  flutter_riverpod: ^3.3.1
  crypto: ^3.0.6
  # BlueZ (Linux Bluetooth links, bluez_le.dart).
  dbus: ^0.7.12
  mime: ^2.0.0
  video_player: ^2.10.0
  # Linux has no video_player backend: UnsupportedVideoPlayer stands in.
  video_player_platform_interface: ^6.9.0
  video_player_win: ^3.2.2
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  qr_code_dart_scan: ^0.11.5
  record: ^6.2.0
  zstandard: ^1.5.0
  flutter_local_notifications: ^21.0.0
  flutter_foreground_task: ^9.2.1
  cryptography: ^2.9.0
  flutter_secure_storage: ^10.0.0
  local_auth: ^2.3.0
  system_tray: ^2.0.3
  window_manager: ^0.5.1
  # 1.5.0+: a prebuilt libwebrtc for Windows on ARM64 (windows-arm64).
  flutter_webrtc: ^1.5.2
  app_links: ^6.0.0
  image_picker: ^1.2.3
  # The own camera of the "Filmy" section (hold to record).
  camera: ^0.11.0
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# system_tray 2.0.3 pins uuid ^3; this lets the rest of the tree use uuid 4
# (system_tray only calls `const Uuid().v1()`, which uuid 4 keeps unchanged).
dependency_overrides:
  uuid: ^4.5.1

flutter:
  uses-material-design: true

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Variable.ttf
    - family: Hanken Grotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Variable.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
    - family: Space Mono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf

  assets:
    - assets/branding/
    # Translations of the Polish texts in the code (tool/i18n.dart).
    - assets/i18n/
    # Licenses of the Go bridge's modules (tool/go_licenses.dart) and fonts.
    - assets/licenses/go/
    - assets/licenses/fonts/
    # Native libraries and Zen's own assets (THIRD_PARTY_NOTICES.md), and
    # the additional terms of Zen's licence.
    - assets/licenses/native/
    - NOTICE
    # The terms and the privacy policy, read and accepted in the app.
    - docs/TERMS.md
    - docs/PRIVACY.md
    # Zen's own sounds (tool/sounds/generate_sounds.py).
    - assets/sounds/
