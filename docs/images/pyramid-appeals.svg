<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" viewBox="0 0 780 300" role="img" aria-labelledby="title desc">
  <title id="title">The appeal path in the pyramid</title>
  <desc id="desc">Chris, the head of a cell, and Gus, the other member, remove Hana from the pyramid. Hana appeals one level above the one who decided: to Adam, who has 3 days to answer. If Adam refuses or does not answer in time, Hana can go one level up, to the top, which decides with 2 of 3 and has 6 days. The time doubles at every level. A refusal by the top is final. An appeal accepted at any level undoes the decision: a ban is lifted, a removed person gets their place back, a verdict is quashed. Parties to a case never judge it.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" text-anchor="middle" fill="#ffffff">
    <rect x="20" y="30" width="170" height="86" rx="12" fill="#b91c1c"/>
    <text x="105" y="58" font-size="15" font-weight="700">Decision</text>
    <text x="105" y="80" font-size="12">Chris, head of the cell,</text>
    <text x="105" y="98" font-size="12">and Gus remove Hana</text>

    <rect x="215" y="30" width="170" height="86" rx="12" fill="#2563eb"/>
    <text x="300" y="58" font-size="15" font-weight="700">Appeal 1</text>
    <text x="300" y="80" font-size="12">Adam, one level up</text>
    <text x="300" y="98" font-size="12">answers within 3 days</text>

    <rect x="410" y="30" width="170" height="86" rx="12" fill="#6d28d9"/>
    <text x="495" y="58" font-size="15" font-weight="700">Appeal 2</text>
    <text x="495" y="80" font-size="12">the top, 2 of 3</text>
    <text x="495" y="98" font-size="12">answers within 6 days</text>

    <rect x="605" y="30" width="155" height="86" rx="12" fill="#57606a"/>
    <text x="682" y="58" font-size="15" font-weight="700">Final</text>
    <text x="682" y="80" font-size="12">a refusal by the top</text>
    <text x="682" y="98" font-size="12">ends the road</text>

    <g stroke="#8b949e" stroke-width="2.5">
      <line x1="192" y1="73" x2="210" y2="73" marker-end="url(#arrow)"/>
      <line x1="387" y1="73" x2="405" y2="73" marker-end="url(#arrow)"/>
      <line x1="582" y1="73" x2="600" y2="73" marker-end="url(#arrow)"/>
      <line x1="300" y1="118" x2="300" y2="196" marker-end="url(#arrow)"/>
      <line x1="495" y1="118" x2="495" y2="196" marker-end="url(#arrow)"/>
    </g>
    <rect x="200" y="2" width="390" height="24" rx="12" fill="#57606a"/>
    <text x="395" y="19" font-size="12">refused or no answer in time → one level up</text>
    <rect x="320" y="146" width="160" height="24" rx="12" fill="#15803d"/>
    <text x="400" y="163" font-size="12">accepted</text>

    <rect x="215" y="200" width="545" height="56" rx="12" fill="#15803d"/>
    <text x="487" y="224" font-size="14" font-weight="700">Accepted at any level: the decision is undone</text>
    <text x="487" y="244" font-size="12">ban lifted · a removed person back in their place · a verdict quashed</text>

    <rect x="20" y="268" width="740" height="26" rx="13" fill="#57606a"/>
    <text x="390" y="286" font-size="12">The time doubles per level (3, 6, 12, 24 … days) · parties to a case never judge it · appeals are public to members</text>
  </g>
</svg>
