# GitHub Pages (tool/pages): the invitation page
# (https://robertostrowskijagoda.github.io/Zen/#KOD opens Zen with that
# code), the install page (/install/) with one page per system, the guide,
# features, support and about pages (all of tool/pages is copied, with the
# shared site.css and site.js) and, made here from the latest
# published release:
#   /apps.json     an AltStore / SideStore source: "Add Zen source" in
#                  SideStore installs the release's Zen-unsigned.ipa and
#                  keeps it up to date (tool/ci/release_source.py);
#   /scarlet.json  the same app as a Scarlet repo ("Add Zen to Scarlet");
#   /release.json  version, files and sizes, and the Android signing
#                  certificate fingerprint, for the install page;
#   /zen-icon.png  the app icon the source names.
# The app's data in apps.json (permissions, version numbers) comes from
# the release itself (its Zen-unsigned.ipa, checked against its
# SHA256SUMS), never from main: AltStore refuses an app whose permissions
# differ from its source's. The fingerprint is the one the code pins at
# the release tag; a release whose APK (any of the per-ABI ones) or IPA
# contradicts it stops the deployment (the old pages stay).
# Runs on a push to main that changes them, by hand, once a day, and when
# a release is published: that event only asks for a run on main (the
# github-pages environment deploys from main only), so the source follows
# every release. Needs Settings -> Pages -> Source: GitHub Actions (once).
# No secret is used; the token reads the repository and, for the release
# event, may start this workflow. Actions are pinned to commit SHAs
# (Dependabot updates them).
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'tool/pages/**'
      - 'tool/ci/release_source.py'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.event_name == 'release' && 'kick' || 'deploy' }}
  cancel-in-progress: true

jobs:
  kick:
    name: Refresh after a release
    # Pages exist only once the repository is public (docs/RELEASES.md).
    if: github.event_name == 'release' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Run this workflow on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

  deploy:
    name: Pages and the iPhone source
    if: github.event_name != 'release' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Site
        run: |
          rm -rf _site
          cp -R tool/pages _site
          cp ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png _site/zen-icon.png

      # Best effort: the certificate of each APK of the latest release (one
      # per ABI; apksigner of the runner's SDK), one line each, which
      # release_source.py compares with the fingerprint the code pins at the
      # release tag.
      - name: Android signing certificates of the latest release
        continue-on-error: true
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          : > "$RUNNER_TEMP/fingerprint.txt"
          for apk in Zen-arm64-v8a.apk Zen-armeabi-v7a.apk Zen-x86_64.apk; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$apk" \
              "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/$apk"
            "$apksigner" verify --print-certs "$RUNNER_TEMP/$apk" \
              | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 \
              >> "$RUNNER_TEMP/fingerprint.txt"
          done
          cat "$RUNNER_TEMP/fingerprint.txt"

      - name: SideStore / AltStore and Scarlet sources and release data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tool/ci/release_source.py
          --repo "$GITHUB_REPOSITORY" --site _site
          --fingerprint "$RUNNER_TEMP/fingerprint.txt"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
