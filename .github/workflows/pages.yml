# The invitation page (tool/pages) on GitHub Pages:
# https://robertostrowskijagoda.github.io/Zen/#KOD opens Zen with that code.
# Needs Settings -> Pages -> Source: GitHub Actions (once).
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'tool/pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Invitation page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: tool/pages

      - id: deployment
        uses: actions/deploy-pages@v4
