# GitHub Pages (tool/pages): the invitation page
# (https://robertostrowskijagoda.github.io/Zen/#KOD opens Zen with that
# code), the install page (/install/) with one page per system, the guide,
# features, support and about pages (all of tool/pages is copied, with the
# shared site.css and site.js) and, made here from the latest
# published release:
#   /apps.json     an AltStore / SideStore source: "Add Zen source" in
#                  SideStore installs the release's Zen-unsigned.ipa and
#                  keeps it up to date (tool/ci/release_source.py);
#   /release.json  version, tag, files and sizes, zen-min and the Android
#                  signing certificate fingerprint, for the install page
#                  and for the app's update check (asked before GitHub's
#                  rate-limited API);
#   /zen-icon.png  the app icon the source names;
#   /sitemap.xml   every page that may be indexed, in its 21 languages,
#                  dated by its last commit (tool/ci/site_files.py);
#   /.well-known/security.txt  where to report a vulnerability, renewed
#                  by every run (it expires after a year).
# The latest release's version also goes into the pages' structured data.
# The app's data in apps.json (permissions, version numbers) comes from
# the release itself (its Zen-unsigned.ipa, checked against its
# SHA256SUMS), never from main: AltStore refuses an app whose permissions
# differ from its source's. The fingerprint is the one the code pins at
# the release tag; a release whose APK (any of the per-ABI ones) or IPA
# contradicts it stops the deployment (the old pages stay).
# Runs on a push to main that changes them, by hand, once a day, and when
# a release is published or a pre-release is promoted to a release
# (`published` and `released`: promoting fires only `released`, and a
# release published at once fires both): those events only ask for a run
# on main (the github-pages environment deploys from main only), so the
# source follows every release. Needs Settings -> Pages -> Source: GitHub Actions (once).
# No secret is used; the token reads the repository and, for the release
# event, may start this workflow. Actions are pinned to commit SHAs
# (Dependabot updates them).
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'tool/pages/**'
      - 'tool/ci/release_source.py'
      - 'tool/ci/site_files.py'
      - '.github/workflows/pages.yml'
  release:
    types: [published, released]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions: {}

# Only the requests for a run replace each other. A deployment is never
# cancelled once started: Pages then still holds it as in progress for a
# while, and the next deployment is refused for it ("in progress
# deployment"), which is how the deployment right after a release has been
# failing. A newer run waits for the running one.
concurrency:
  group: pages-${{ github.event_name == 'release' && 'kick' || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'release' }}

jobs:
  kick:
    name: Refresh after a release
    # Pages exist only once the repository is public (docs/RELEASES.md).
    if: github.event_name == 'release' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Run this workflow on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          for attempt in 1 2 3; do
            gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" && exit 0
            echo "The request failed (attempt $attempt): again in 20 s."
            sleep 20
          done
          exit 1

  deploy:
    name: Pages and the iPhone source
    if: github.event_name != 'release' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_again.outputs.page_url || steps.deployment_last.outputs.page_url }}
    steps:
      # The whole history: the sitemap dates each page by its last commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Site
        run: |
          rm -rf _site
          cp -R tool/pages _site
          cp ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png _site/zen-icon.png

      # Best effort: the certificate of each APK of the latest release (one
      # per ABI; apksigner of the runner's SDK), one line each, which
      # release_source.py compares with the fingerprint the code pins at the
      # release tag.
      - name: Android signing certificates of the latest release
        continue-on-error: true
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          : > "$RUNNER_TEMP/fingerprint.txt"
          for apk in Zen-arm64-v8a.apk Zen-armeabi-v7a.apk Zen-x86_64.apk; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$apk" \
              "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/$apk"
            "$apksigner" verify --print-certs "$RUNNER_TEMP/$apk" \
              | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 \
              >> "$RUNNER_TEMP/fingerprint.txt"
          done
          cat "$RUNNER_TEMP/fingerprint.txt"

      - name: SideStore / AltStore source and release data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tool/ci/release_source.py
          --repo "$GITHUB_REPOSITORY" --site _site
          --fingerprint "$RUNNER_TEMP/fingerprint.txt"

      - name: Sitemap, security.txt and the version in the structured data
        run: python3 tool/ci/site_files.py --site _site --source tool/pages

      # .well-known (security.txt) is a hidden folder: left out unless asked.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true

      # Up to three tries with the same uploaded site, 90 and 240 seconds
      # apart: a refused or failed deployment (Pages still busy with the
      # last one, a hiccup of the service) must not leave the install page
      # and the SideStore source on the old version until the next day's
      # run. A deployment is made anew each time from the one artifact, so
      # a try after a failure changes nothing a successful one has done.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 300000

      - name: Wait before the second try
        if: steps.deployment.outcome == 'failure'
        run: sleep 90

      - id: deployment_again
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 300000

      - name: Wait before the last try
        if: steps.deployment.outcome == 'failure' && steps.deployment_again.outcome == 'failure'
        run: sleep 240

      - id: deployment_last
        if: steps.deployment.outcome == 'failure' && steps.deployment_again.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 300000
