# A version tag (v1.10.0, …) builds the release files: one APK per Android
# ABI, all signed with the release key and with the same version code:
# Zen-arm64-v8a.apk (most phones), Zen-armeabi-v7a.apk (older 32-bit
# phones) and Zen-x86_64.apk (Chromebooks, emulators),
# Zen-Windows.zip (x64), Zen-Windows-arm64.zip, Zen-Linux-x64.tar.gz,
# Zen-Linux-arm64.tar.gz, Zen-Linux-x64.deb, Zen-Linux-arm64.deb,
# Zen-Linux-x64.flatpak,
# Zen-macOS.zip (universal), Zen-unsigned.ipa (the iOS workflow),
# LICENSES-GO.txt, LICENSE, NOTICE, THIRD_PARTY_NOTICES.md, whats-new.json
# (the short note from CHANGELOG.md the app shows with the update notice),
# SHA256SUMS of all of them and
# SHA256SUMS.sig (SHA256SUMS signed with the release signing key), and
# attaches them to a draft release of that tag.
#
# How a tag run goes: every build runs at the same time, each in its own
# job, and uploads its files as an artifact; the three APKs are built in
# three jobs, without any key. When all builds are done, the sign job (the
# only job with the keys) signs the APKs, writes whats-new.json and
# SHA256SUMS and signs SHA256SUMS, and the last job attaches everything.
# GitHub asks for one approval, when the sign job is about to start (so
# about half an hour after the push, not at the start). Publish the draft
# by hand after checking it (docs/RELEASES.md, section 3). Publishing it
# starts pages.yml, which rebuilds the install page data and the
# SideStore / AltStore source (apps.json) for the new Zen-unsigned.ipa.
#
# The release keys:
# - Only a run of a tag v* ever touches them. The android jobs and the sign
#   job run only for refs/tags/v*, and the sign job never runs from a
#   branch. Actions -> Release -> Run workflow from a BRANCH still builds
#   the other files (unsigned, as always: Windows, Linux, macOS ad hoc,
#   iOS) as artifacts of the run, with SHA256SUMS (the checksums job), but
#   no APK and nothing is signed or attached to a release. For a signed APK
#   push a tag (or run the workflow from the tag).
# - The android jobs build without the key, so Gradle signs their APKs with
#   the runner's own throwaway debug key (android/app/build.gradle.kts).
#   Such a file must never look like a release file: it stays an artifact
#   named unsigned-apk-<abi> holding app-<abi>-release.apk, and only the
#   sign job turns it into Zen-<abi>.apk, by replacing that signature with
#   the release key (apksigner).
# - The sign job runs in the environment "release". Create it once in
#   Settings -> Environments -> New environment "release":
#     * Required reviewers: the maintainer, so every tag run waits for one
#       approval before the sign job (and the keys) starts;
#     * Deployment branches and tags: "Selected branches and tags", one tag
#       rule "v*";
#     * Environment secrets: ANDROID_KEYSTORE_BASE64 (the .jks file, base64),
#       ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD;
#       then delete them from the repository secrets, so that no other job
#       can read them. Without them the APKs are left out (a warning).
#     * ZEN_RELEASE_SIGNING_KEY: the release signing key (the contents of
#       the file `dart run tool/zen_release.dart keygen` wrote; its hybrid
#       id is in kReleaseMaintainers, docs/RELEASES.md, section 8.6). The sign job
#       signs SHA256SUMS with it and stops the run when the key is not one
#       kReleaseMaintainers pins. Without it SHA256SUMS.sig is not made (a
#       warning), and builds that know a release key refuse to update
#       themselves from that release.
# - A tag run stops at once (in the android jobs, and in the sign job
#   before any key) while the app pins no release key or APK certificate
#   (tool/release.dart pinned).
#   Environments with reviewers are free for public repositories. A private
#   repository needs a paid plan for environments (Pro, Team or Enterprise),
#   and GitHub Enterprise for required reviewers. Until the environment
#   exists GitHub creates an empty one (no reviewers, no rules) at the first
#   run; the tag condition holds anyway.
# - Every action is pinned to a full commit SHA (Dependabot keeps them
#   current: .github/dependabot.yml). No caches in this workflow (no
#   Flutter, pub, Gradle or Go cache): a cache written by another run could
#   change what is built and signed, and flutter-action's own cache step
#   uses actions/cache by tag, not by SHA. The run is fast because the
#   builds run side by side, not because anything is reused.
# - GITHUB_TOKEN: read-only in every job; contents: write only in the last
#   job, which runs only for tags and does nothing but attach the files.
#   It never replaces a file already attached (no --clobber) and never
#   touches a release that is already published.
# - The signing keys live only in the environment "release": the preflight
#   job (no environment) fails the run when any of them is also a
#   repository or organization secret, which every job could read, and the
#   sign job starts only after it passed.
# - Linux is built on Ubuntu 22.04 (glibc 2.35), so the files run on
#   Ubuntu 22.04+, Debian 12+ and Linux Mint 21+; tool/ci/check_linux_abi.sh
#   fails the build when a binary needs a newer glibc or libstdc++. Every
#   Linux runner is pinned to an image (never the "latest" label, which
#   moves to a new Ubuntu every two years). GitHub retires the ubuntu-22.04
#   images in April 2027 (with brownouts before): by then move these jobs
#   into an ubuntu:22.04 / debian:12 container, or raise the baseline (and
#   the README) together with the image.
# - Every `flutter pub get` uses --enforce-lockfile: exactly the packages
#   (and their hashes) of pubspec.lock. The Linux tar.gz is made with
#   SOURCE_DATE_EPOCH (the commit's time), sorted names and no owners.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.1'

jobs:
  # Before anything is signed: the signing keys are where they belong and
  # the tag is the version of the build. The sign job starts only after
  # this passed.
  preflight:
    name: Keys and version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # This job has no environment: it sees only repository and
      # organization secrets, where a signing key must never be (every job
      # of every workflow could read it there, without an approval).
      - name: The signing keys are only in the environment "release"
        env:
          K1: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          K2: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          K3: ${{ secrets.ANDROID_KEY_PASSWORD }}
          K4: ${{ secrets.ZEN_RELEASE_SIGNING_KEY }}
        run: |
          if [ -n "$K1$K2$K3$K4" ]; then
            echo "::error::A signing secret is also a repository or organization secret: delete it there (Settings -> Secrets and variables -> Actions) and keep it only in the environment 'release'."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The app reports the version of pubspec.yaml and treats the tag as
      # the release's version: if they differ, every build would keep
      # offering this release as an update (tool/release.dart prepare sets
      # both).
      - name: The tag is the version of the build
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version: *\([0-9][0-9.]*\)+.*$/\1/p' pubspec.yaml)
          app=$(sed -n "s/^const String kAppVersion = '\(.*\)';$/\1/p" lib/src/app/app_version.dart)
          if [ "v$version" != "$GITHUB_REF_NAME" ] || [ "$app" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, pubspec.yaml $version, app_version.dart $app: they must agree (dart run tool/release.dart prepare)."
            exit 1
          fi

  # One APK per ABI (a universal one carries all three and is much bigger),
  # each ABI in its own job at the same time, with only its own Go bridge.
  # The app picks the APK of its device's ABI (android_abi.dart), as does
  # Obtainium (by the ABI in the file name). The version code is the same
  # in all three (android/gradle.properties). No key here: the sign job
  # signs them (see the top).
  android:
    name: Android (${{ matrix.abi }})
    # Never from a branch (see the top).
    if: startsWith(github.ref, 'refs/tags/v')
    # Linux, as CI's android-bridge job: Gradle and the Go bridge build
    # there much faster than on Windows (build_if_changed.sh, the twin of
    # the Windows script, docs/RELEASES.md, section 3.1).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            platform: android-arm64
          - abi: armeabi-v7a
            platform: android-arm
          - abi: x86_64
            platform: android-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: native/yggdrasil_bridge/go.mod
          cache: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false

      - name: Packages
        run: flutter pub get --enforce-lockfile

      # A tag builds a release only when the app pins its release keys
      # (kReleaseMaintainers, kOfficialApkCertificatesSha256): without them
      # the computers would take an update whose SHA256SUMS nobody signed.
      # `tool/release.dart prepare` checks the same, but a tag can be pushed
      # without it. Checked first, so such a tag stops within minutes.
      - name: The app pins its release keys
        if: startsWith(github.ref, 'refs/tags/v')
        run: dart run tool/release.dart pinned

      # Built on its own, with its output in the log, and with the newest
      # NDK as in CI; it leaves the stamp that tells Gradle's buildGoBridge
      # the library is up to date. Each 64-bit library must work with 16 KB
      # pages (Google Play, Android 15+).
      - name: Go bridge (${{ matrix.abi }})
        env:
          ABI: ${{ matrix.abi }}
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          sh native/yggdrasil_bridge/build_if_changed.sh "$ABI"
          lib="android/app/src/main/jniLibs/$ABI/libyggdrasil_bridge.so"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" \
            -D --defined-only "$lib" | grep -q ' YggStartNode$'
          ls -l "$lib"
          python3 tool/ci/check_page_alignment.py "android/app/src/main/jniLibs/$ABI"

      - name: Build
        run: flutter build apk --release --split-per-abi --target-platform ${{ matrix.platform }}

      # Gradle signed it with this runner's debug key (there is no
      # android/key.properties here): kept under Flutter's name, never as
      # a release file, for the sign job only.
      - name: APK for the sign job
        env:
          ABI: ${{ matrix.abi }}
        run: |
          test ! -e android/key.properties
          mkdir -p apk
          cp "build/app/outputs/flutter-apk/app-$ABI-release.apk" apk/
          ls -l apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apk-${{ matrix.abi }}
          path: apk/
          retention-days: 7
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      LLVM_MINGW_VERSION: '20251021'
      LLVM_MINGW_SHA256: 0a0ce4733b54de8c4858ecfc2a08447de57728dccf9fbf7fcba3ce7e0d0c6af8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: native/yggdrasil_bridge/go.mod
          cache: false

      # The runner has no C compiler for cgo: the same llvm-mingw as the
      # ARM64 job, x86_64 build, checked against its SHA-256.
      - name: C compiler for cgo (llvm-mingw, checked against its SHA-256)
        shell: pwsh
        run: |
          $name = "llvm-mingw-$env:LLVM_MINGW_VERSION-ucrt-x86_64"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest -UseBasicParsing -OutFile $zip `
            -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_VERSION/$name.zip"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($hash -ne $env:LLVM_MINGW_SHA256) {
            throw "llvm-mingw: SHA-256 $hash, expected $env:LLVM_MINGW_SHA256"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP "$name\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false

      - name: Packages
        run: flutter pub get --enforce-lockfile

      # Built on its own, with its output in the log; inside MSBuild a
      # failure says nothing about why, so it is skipped there.
      - name: Go bridge (x64)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File native/yggdrasil_bridge/build_if_changed.ps1 -Target windows -Arch x64

      - name: Build
        env:
          ZEN_SKIP_GO_BRIDGE: '1'
        run: flutter build windows --release

      # The Visual C++ runtime next to zen.exe (Flutter's "Building your own
      # zip file for Windows"): a fresh Windows without the VC++
      # Redistributable could not start Zen otherwise. From the runner's
      # Visual Studio (Microsoft allows redistributing these files).
      - name: Visual C++ runtime
        shell: pwsh
        run: ./tool/ci/copy_vc_runtime.ps1 -Arch x64 -Destination build/windows/x64/runner/Release

      - name: Check the folder (runtime, libraries)
        shell: pwsh
        run: |
          python tool/ci/check_windows_bundle.py build/windows/x64/runner/Release `
            --require msvcp140.dll --require vcruntime140.dll --require vcruntime140_1.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The prebuilt libwebrtc flutter_webrtc downloaded, against the
          # SHA-256 pinned in tool/ci/libwebrtc.sha256.
          python tool/ci/check_libwebrtc.py --strict windows-x64 build/windows/x64/runner/Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The zip holds one folder, Zen\, so "Extract here" never spills
      # zen.exe and its DLLs into Downloads (where a planted DLL would load
      # with it). Its zen-app.marker lists everything in the folder: the app
      # updates itself in place only in a folder that holds exactly that
      # (isOwnAppFolder in lib/src/features/update/github_update_installer.dart),
      # never in Downloads or on the Desktop.
      - name: Release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $app = Join-Path $env:RUNNER_TEMP 'zip/Zen'
          if (Test-Path -LiteralPath $app) { Remove-Item -LiteralPath $app -Recurse -Force }
          New-Item -ItemType Directory -Force (Split-Path $app) | Out-Null
          Copy-Item -Recurse -LiteralPath build/windows/x64/runner/Release -Destination $app
          $names = @(Get-ChildItem -LiteralPath $app -Force | ForEach-Object { $_.Name } | Sort-Object)
          Set-Content -LiteralPath (Join-Path $app 'zen-app.marker') -Encoding ascii -Value (@('zen-app 1') + $names)
          Compress-Archive -Path $app -DestinationPath dist/Zen-Windows.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: dist/
          if-no-files-found: error

  # Windows on ARM: built natively (Flutter builds windows-arm64 only on an
  # ARM64 computer), the Go bridge with llvm-mingw (MSVC's clang cannot
  # build cgo). Not required for a release yet: until its first green run
  # a failure here leaves out Zen-Windows-arm64.zip and nothing else (see
  # the sign job). The x64 Zen-Windows.zip also runs there, emulated.
  windows-arm64:
    name: Windows (ARM64)
    runs-on: windows-11-arm
    timeout-minutes: 75
    continue-on-error: true
    permissions:
      contents: read
    env:
      LLVM_MINGW_VERSION: '20251021'
      LLVM_MINGW_SHA256: d31dd2799c18440acb7cc13b03cadfc3069dff48168cd406a44930e965b09655
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: native/yggdrasil_bridge/go.mod
          cache: false

      - name: C compiler for cgo (llvm-mingw, checked against its SHA-256)
        shell: pwsh
        run: |
          $name = "llvm-mingw-$env:LLVM_MINGW_VERSION-ucrt-aarch64"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest -UseBasicParsing -OutFile $zip `
            -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_VERSION/$name.zip"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($hash -ne $env:LLVM_MINGW_SHA256) {
            throw "llvm-mingw: SHA-256 $hash, expected $env:LLVM_MINGW_SHA256"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP "$name\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      # No Flutter SDK archive for Windows ARM64: the action clones the
      # repository (channel master) and checks out the release tag, as for
      # Linux ARM64.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false

      - name: Packages
        run: flutter pub get --enforce-lockfile

      # Built on its own, with its output in the log; inside MSBuild its
      # check fails on this runner without saying why, so it is skipped there.
      - name: Go bridge (ARM64)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File native/yggdrasil_bridge/build_if_changed.ps1 -Target windows -Arch arm64

      - name: Build
        env:
          ZEN_SKIP_GO_BRIDGE: '1'
        run: flutter build windows --release

      - name: Visual C++ runtime
        shell: pwsh
        run: ./tool/ci/copy_vc_runtime.ps1 -Arch arm64 -Destination build/windows/arm64/runner/Release

      - name: Check the folder (runtime, libraries)
        shell: pwsh
        run: |
          if (-not (Get-Command python -ErrorAction SilentlyContinue)) {
            Write-Output '::warning::No Python on this runner: the folder is not checked.'
            exit 0
          }
          python tool/ci/check_windows_bundle.py build/windows/arm64/runner/Release `
            --require msvcp140.dll --require vcruntime140.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The prebuilt libwebrtc flutter_webrtc downloaded, against the
          # SHA-256 pinned in tool/ci/libwebrtc.sha256.
          python tool/ci/check_libwebrtc.py --strict windows-arm64 build/windows/arm64/runner/Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Release files
        shell: pwsh
        run: |
          if (-not (Test-Path build/windows/arm64/runner/Release/yggdrasil_bridge.dll)) {
            throw 'The ARM64 build has no Go bridge'
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          # One Zen\ folder with its zen-app.marker, as the x64 zip.
          $app = Join-Path $env:RUNNER_TEMP 'zip/Zen'
          if (Test-Path -LiteralPath $app) { Remove-Item -LiteralPath $app -Recurse -Force }
          New-Item -ItemType Directory -Force (Split-Path $app) | Out-Null
          Copy-Item -Recurse -LiteralPath build/windows/arm64/runner/Release -Destination $app
          $names = @(Get-ChildItem -LiteralPath $app -Force | ForEach-Object { $_.Name } | Sort-Object)
          Set-Content -LiteralPath (Join-Path $app 'zen-app.marker') -Encoding ascii -Value (@('zen-app 1') + $names)
          Compress-Archive -Path $app -DestinationPath dist/Zen-Windows-arm64.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-arm64
          path: dist/
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04: glibc 2.35, the oldest system the files support
          # (see the top and tool/ci/check_linux_abi.sh).
          - arch: x64
            runner: ubuntu-22.04
          # Flutter publishes no SDK archive for Linux ARM64, so the
          # flutter-action clones the repository (channel master) and checks
          # out the release tag; libwebrtc and Go have arm64 builds.
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Flutter's Linux toolchain; libsecret for flutter_secure_storage,
      # the app indicator for system_tray, GStreamer for audio and video
      # (linux/runner/zen_media_player.cc), make and g++ for Zen's own H.264
      # encoder (OpenH264, built from source), dpkg-dev for the .deb.
      - name: Build tools and libraries
        run: |
          sudo apt-get update
          # Ubuntu 22.04 runners carry libunwind-14-dev, which conflicts
          # with the libunwind-dev that libgstreamer1.0-dev needs.
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            make g++ \
            libstdc++-12-dev libsecret-1-dev libayatana-appindicator3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpulse-dev \
            dpkg-dev

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: native/yggdrasil_bridge/go.mod
          cache: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: ${{ matrix.arch == 'arm64' && 'master' || 'stable' }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false

      - name: Packages
        run: flutter pub get --enforce-lockfile

      - name: Build (the Go bridge builds itself)
        run: flutter build linux --release

      # No binary may need a newer glibc / libstdc++ than Ubuntu 22.04's.
      - name: Check the bundle (glibc baseline, libraries)
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          bundle="build/linux/$ARCH/release/bundle"
          sh tool/ci/check_linux_abi.sh "$bundle" 2.35 3.4.30
          # The prebuilt libwebrtc flutter_webrtc downloaded, against the
          # SHA-256 pinned in tool/ci/libwebrtc.sha256.
          python3 tool/ci/check_libwebrtc.py --strict "linux-$ARCH" "$bundle"

      - name: Release files
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          bundle="build/linux/$ARCH/release/bundle"
          test -f "$bundle/lib/libyggdrasil_bridge.so"
          # Built with the media player (GStreamer), not without it.
          ldd "$bundle/zen" | grep -q 'libgstreamer-1.0'
          mkdir -p dist
          # zen-app.marker lists everything in the folder: the app updates
          # itself in place only in a folder that holds exactly that
          # (isOwnAppFolder, github_update_installer.dart).
          { echo 'zen-app 1'; find "$bundle" -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort; } > "$RUNNER_TEMP/zen-app.marker"
          mv "$RUNNER_TEMP/zen-app.marker" "$bundle/zen-app.marker"
          # The same bytes for the same commit: the commit's time on every
          # file, sorted names, no owners, no time in the gzip header.
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          tar -C "build/linux/$ARCH/release" --transform 's,^bundle,Zen,' \
            --sort=name --mtime="@$SOURCE_DATE_EPOCH" \
            --owner=0 --group=0 --numeric-owner -cf - bundle \
            | gzip -9n > "dist/Zen-Linux-$ARCH.tar.gz"
          sh linux/packaging/build_deb.sh "$bundle" "$ARCH" "dist/Zen-Linux-$ARCH.deb"
          dpkg-deb --info "dist/Zen-Linux-$ARCH.deb"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  # Flatpak of the Linux x64 bundle built above (no second build from
  # source): linux/packaging/com.roj.zen.yml only unpacks the tar.gz.
  flatpak:
    name: Flatpak (x64)
    needs: linux
    # Only unpacks the bundle; the tray libraries it copies from this runner
    # must not need a newer glibc than the GNOME runtime's.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-x64
          path: linux-dist

      - name: Flatpak tools and the tray libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder elfutils libayatana-appindicator3-1 libgtk-3-0t64
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build
        run: |
          work="$RUNNER_TEMP/flatpak"
          mkdir -p "$work/extra-lib" dist
          cp linux/packaging/com.roj.zen.yml linux/packaging/com.roj.zen.desktop \
            linux/packaging/com.roj.zen.metainfo.xml LICENSE NOTICE "$work/"
          cp linux-dist/Zen-Linux-x64.tar.gz "$work/"
          # The GNOME runtime has no libayatana-appindicator3: take it and
          # its dependencies that the runtime lacks from this runner.
          tar -xzf linux-dist/Zen-Linux-x64.tar.gz -C "$RUNNER_TEMP"
          LD_LIBRARY_PATH="$RUNNER_TEMP/Zen/lib" ldd "$RUNNER_TEMP/Zen/zen" \
            | awk '/(ayatana|dbusmenu|indicator)/ && $3 ~ /^\// { print $3 }' \
            | while read -r library; do cp -L "$library" "$work/extra-lib/"; done
          ls "$work/extra-lib"
          test -n "$(ls "$work/extra-lib")"
          cd "$work"
          flatpak-builder --user --force-clean --install-deps-from=flathub \
            --repo=repo build com.roj.zen.yml
          # --runtime-repo: `flatpak install` of the file offers to add
          # Flathub for the GNOME runtime when the system does not have it.
          flatpak build-bundle \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo "$GITHUB_WORKSPACE/dist/Zen-Linux-x64.flatpak" com.roj.zen
          ls -l "$GITHUB_WORKSPACE/dist/Zen-Linux-x64.flatpak"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-flatpak
          path: dist/
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: native/yggdrasil_bridge/go.mod
          cache: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false

      - name: Go bridge (universal static library)
        run: sh native/yggdrasil_bridge/build_macos.sh

      - name: Packages
        run: flutter pub get --enforce-lockfile

      - name: Build (signed ad hoc, not notarized)
        run: flutter build macos --release

      # The WebRTC framework CocoaPods downloaded (a zip from a GitHub
      # release, which CocoaPods never checks) against the hash pinned in
      # tool/ci/webrtc_sdk.sha256; a release build fails without a pin.
      - name: WebRTC framework (pinned SHA-256)
        run: |
          if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            python3 tool/ci/check_webrtc_sdk.py --strict macos/Pods
          else
            python3 tool/ci/check_webrtc_sdk.py macos/Pods
          fi

      # Once macos/Podfile.lock is committed the build must use exactly its
      # pods (without it CocoaPods resolves them anew on every build); until
      # then this build's file is kept as the artifact podfile-lock-macos,
      # to be committed.
      - name: Pods as locked (macos/Podfile.lock)
        run: |
          if git ls-files --error-unmatch macos/Podfile.lock > /dev/null 2>&1; then
            if ! git diff --exit-code -I '^COCOAPODS:' -- macos/Podfile.lock; then
              echo "::error::The build resolved other pods than the committed macos/Podfile.lock."
              exit 1
            fi
          else
            echo "::warning::macos/Podfile.lock is not committed: the pods are resolved anew on every build. Commit the file of the artifact podfile-lock-macos."
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Also when the check above fails: that file is the one to commit.
        if: always()
        with:
          name: podfile-lock-macos
          path: macos/Podfile.lock
          if-no-files-found: warn

      - name: Release files
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/macos/Build/Products/Release/Zen.app dist/Zen-macOS.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/
          if-no-files-found: error

  ios:
    name: iOS
    permissions:
      contents: read
    uses: ./.github/workflows/ios.yml

  # The only job with the release keys, and so the only one GitHub asks to
  # approve (the environment "release", see the top). It starts when every
  # required build is done and the preflight passed; never after a failed
  # or cancelled build. windows-arm64 is not required yet (see that job):
  # its file is included when built.
  # In this order: the APKs are signed with the release key and checked;
  # whats-new.json and the licences join the other files; SHA256SUMS lists
  # all of them (the signed APKs too); SHA256SUMS.sig signs SHA256SUMS
  # (lib/src/features/update/release.dart, SignedSums, checks it before
  # the app updates itself from GitHub). Everything else of the tag that
  # builds or runs code runs before a key is on disk, and each key is
  # deleted right after its use.
  sign:
    name: Sign
    needs: [preflight, android, windows, windows-arm64, linux, flatpak, macos, ios]
    if: >-
      !cancelled()
      && startsWith(github.ref, 'refs/tags/v')
      && needs.preflight.result == 'success'
      && needs.android.result == 'success'
      && needs.windows.result == 'success'
      && needs.linux.result == 'success'
      && needs.flatpak.result == 'success'
      && needs.macos.result == 'success'
      && needs.ios.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # apksigner (from the runner's Android SDK) runs on Java.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false

      # The signature is hybrid (Ed25519 + ML-DSA-65): the tool signs with
      # the bridge's Go (native/yggdrasil_bridge/cmd/zensig).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: native/yggdrasil_bridge/go.mod
          cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Zen-unsigned-ipa
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unsigned-apk-*
          path: apk
          merge-multiple: true

      # The short note the app shows with the update notice: the "### What's
      # new" part of this version in CHANGELOG.md (tool/release.dart
      # prepare requires it). Made before SHA256SUMS, so SHA256SUMS.sig
      # signs it with every other file. The iPhone file must be there: the
      # SideStore / AltStore source (apps.json on GitHub Pages, pages.yml)
      # points to it.
      - name: Prepare
        env:
          TAG: ${{ github.ref_name }}
        run: |
          flutter pub get --enforce-lockfile
          dart run tool/release.dart pinned
          (cd native/yggdrasil_bridge && go build -o /dev/null ./cmd/zensig)
          dart run tool/release.dart whats-new --version "${TAG#v}" \
            --out dist/whats-new.json
          cat dist/whats-new.json
          test -s dist/Zen-unsigned.ipa || { echo "::error::Zen-unsigned.ipa is missing"; exit 1; }
          rm -f dist/*.sha256
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)
          apksigner="$ANDROID_HOME/build-tools/$tools/apksigner"
          "$apksigner" --version
          echo "APKSIGNER=$apksigner" >> "$GITHUB_ENV"

      - name: Release keys
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_KEY: ${{ secrets.ZEN_RELEASE_SIGNING_KEY }}
        run: |
          apk=true
          sums=true
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::No release key in the secrets of the environment 'release': the APKs are left out."
            apk=false
          fi
          if [ -z "$SIGNING_KEY" ]; then
            echo "::warning::No ZEN_RELEASE_SIGNING_KEY in the secrets of the environment 'release': SHA256SUMS.sig is not made, and builds that know a release key will not update themselves from this release."
            sums=false
          fi
          # A fork may release without keys; this repository may not, or the
          # installed builds would refuse the update and its note.
          if [ "$GITHUB_REPOSITORY" = "robertostrowskijagoda/Zen" ] && { [ "$apk" = false ] || [ "$sums" = false ]; }; then
            echo "::error::A release of this repository needs both keys in the environment 'release'."
            exit 1
          fi
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "sums=$sums" >> "$GITHUB_OUTPUT"

      # The APKs of the android jobs carry the runner's debug signature;
      # apksigner replaces it with the release key's (APK Signature Scheme
      # v2 and v3, as the app reads them: apk_signing_block.dart; no v4
      # .idsig file). The passwords reach apksigner through the
      # environment, never on its command line.
      - name: Sign the APKs
        if: steps.key.outputs.apk == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          jks="$RUNNER_TEMP/zen-release.jks"
          trap 'rm -f "$jks"' EXIT
          umask 077
          printf '%s' "$KEYSTORE" | tr -d ' \t\r\n' | base64 -d > "$jks"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            "$APKSIGNER" sign --ks "$jks" --ks-pass env:STORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
              --v4-signing-enabled false \
              --out "dist/Zen-$abi.apk" "apk/app-$abi-release.apk"
          done
          rm -f "$jks"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            "$APKSIGNER" verify --verbose "dist/Zen-$abi.apk"
          done
          ls -l dist/*.apk

      # All three signed with one and the same certificate (the app checks
      # an update against its own certificate; the install page shows one),
      # and it is the one the app of this tag pins
      # (kOfficialApkCertificatesSha256): another keystore in the
      # environment would make every phone refuse the update.
      - name: One signing certificate, the pinned one
        if: steps.key.outputs.apk == 'true'
        run: dart run tool/zen_release.dart fingerprint --pinned dist/Zen-arm64-v8a.apk dist/Zen-armeabi-v7a.apk dist/Zen-x86_64.apk

      # 16 KB pages: every 64-bit library's LOAD segments aligned to 0x4000
      # and stored on a 16 KB boundary of the APK (Google Play, Android 15+).
      - name: 16 KB page alignment
        if: steps.key.outputs.apk == 'true'
        run: python3 tool/ci/check_page_alignment.py dist/Zen-arm64-v8a.apk dist/Zen-armeabi-v7a.apk dist/Zen-x86_64.apk

      - name: Licenses and SHA256SUMS
        run: |
          export LC_ALL=C
          cp native/yggdrasil_bridge/LICENSES-GO.txt LICENSE NOTICE \
            THIRD_PARTY_NOTICES.md dist/
          cd dist
          sums=$(sha256sum -- *)
          printf '%s\n' "$sums" > SHA256SUMS
          cat SHA256SUMS

      - name: Sign SHA256SUMS
        if: steps.key.outputs.sums == 'true'
        env:
          TAG: ${{ github.ref_name }}
          SIGNING_KEY: ${{ secrets.ZEN_RELEASE_SIGNING_KEY }}
        run: |
          mkdir -p signed
          dart run tool/zen_release.dart sums-manifest --version "${TAG#v}" \
            --out signed/SHA256SUMS.sig dist/SHA256SUMS
          key="$RUNNER_TEMP/zen-release.key"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s' "$SIGNING_KEY" > "$key"
          dart run tool/zen_release.dart sign signed/SHA256SUMS.sig "$key"
          rm -f "$key"
          # Signed with a key the app of this tag pins (kReleaseMaintainers),
          # or the run stops: a release signed with another key would be
          # refused by every computer.
          dart run tool/zen_release.dart verify --pinned signed/SHA256SUMS.sig
          mv signed/SHA256SUMS.sig dist/

      - name: Forget the keys
        if: always()
        run: rm -f "$RUNNER_TEMP/zen-release.jks" "$RUNNER_TEMP/zen-release.key"

      # Every file with its size and SHA-256 on the run's summary page.
      - name: Summary
        if: ${{ !cancelled() }}
        run: python3 tool/ci/ci_summary.py files --dir dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zen-release
          path: dist/
          if-no-files-found: error

  attach:
    name: Draft release
    needs: sign
    # !cancelled(): the optional windows-arm64 job may have failed further
    # up, which alone would skip this job. A failed signing stops it; a
    # missing key only leaves its files out (a warning above).
    if: >-
      !cancelled()
      && needs.sign.result == 'success'
      && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only job that can write: it creates the draft and attaches the
    # files, without checking out or building anything, and without keys.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zen-release
          path: dist

      # Never --clobber: a file once attached is not replaced by a re-run
      # (delete it by hand in the draft first), and a published release is
      # never changed.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            if [ "$draft" != "true" ]; then
              echo "::error::Release $TAG is already published; its files are never replaced."
              exit 1
            fi
          else
            notes="Draft release. What changed: see CHANGELOG.md. Verify your download against the SHA-256 sums (SHA256SUMS), their signature (SHA256SUMS.sig) and the signing certificate fingerprint before installing."
            # The note the app shows (whats-new.json), in English, on top.
            if [ -s dist/whats-new.json ]; then
              news=$(jq -r '.lines.en[] | "- " + .' dist/whats-new.json)
              notes=$(printf "What's new:\n%s\n\n%s" "$news" "$notes")
            fi
            gh release create "$TAG" --draft --title "$TAG" \
              --notes "$notes" \
              --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"

  # A run from a branch has no APKs and signs nothing: the other files with
  # their SHA256SUMS, as an artifact of the run (to try a build before
  # tagging it).
  checksums:
    name: SHA256SUMS
    needs: [preflight, windows, windows-arm64, linux, flatpak, macos, ios]
    if: >-
      !cancelled()
      && !startsWith(github.ref, 'refs/tags/v')
      && needs.preflight.result == 'success'
      && needs.windows.result == 'success'
      && needs.linux.result == 'success'
      && needs.flatpak.result == 'success'
      && needs.macos.result == 'success'
      && needs.ios.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Zen-unsigned-ipa
          path: dist

      - name: Licenses and SHA256SUMS
        run: |
          export LC_ALL=C
          test -s dist/Zen-unsigned.ipa || { echo "::error::Zen-unsigned.ipa is missing"; exit 1; }
          rm -f dist/*.sha256
          cp native/yggdrasil_bridge/LICENSES-GO.txt LICENSE NOTICE \
            THIRD_PARTY_NOTICES.md dist/
          cd dist
          sums=$(sha256sum -- *)
          printf '%s\n' "$sums" > SHA256SUMS
          cat SHA256SUMS

      - name: Summary
        if: ${{ !cancelled() }}
        run: python3 tool/ci/ci_summary.py files --dir dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zen-release
          path: dist/
          if-no-files-found: error
