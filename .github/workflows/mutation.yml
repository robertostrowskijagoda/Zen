# Mutation testing (tool/mutation.dart): the app's core files changed in
# one small place at a time (== and !=, < and >=, && and ||, true and false,
# a ! dropped), each change run against its tests (tool/mutation_targets.json).
# A change no test notices is listed in the run's summary: a line to pin
# down with a test. It informs and never blocks: its job is to say how much
# the tests would notice, not to gate a pull request.
#
# On every pull request to main (beside CI), once a week on main and by
# hand (Actions -> Mutation testing -> Run workflow). The targets are split
# over six runners, about 15 files and under half an hour each: the list
# grows with every release, and a runner with 30 files did not end within
# its 45 minutes, so no run of 1.16.5 said anything. A check of
# tool/ci/test_ci_checks.py fails when a runner would get more than 20:
# then the matrix below gets another runner. Each run picks other changes
# (the seed is the run's number), so over time all of them are tried.
# Read-only token, no secret.
name: Mutation testing

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  mutation:
    name: Mutation testing (${{ matrix.shard }} of 6)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Packages
        run: flutter pub get --enforce-lockfile

      - name: Mutants
        run: >-
          dart run tool/mutation.dart --max 10 --seed ${{ github.run_number }}
          --shard ${{ matrix.shard }}/6
          --summary "$GITHUB_STEP_SUMMARY"
