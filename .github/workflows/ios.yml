# iPhone build without signing: Zen-unsigned.ipa for SideStore / AltStore
# (README, section "iPhone"). Runs by hand (Actions -> iOS -> Run workflow),
# and for version tags as part of the Release workflow, which attaches the
# file to the draft release with the other release files. See
# docs/RELEASES.md. Actions are pinned to commit SHAs (Dependabot updates
# them); this workflow never sees a secret and only reads the repository.
name: iOS

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same Flutter as the Android / Windows builds (pubspec.lock: >= 3.44).
  FLUTTER_VERSION: '3.47.1'

jobs:
  ipa:
    name: Zen-unsigned.ipa
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The `toolchain` line (the patched Go every other build uses, as
      # setup-go's go-version-file does), else the newest patch release of
      # the `go` line.
      - name: Go version from go.mod
        id: go
        run: |
          version=$(awk '
            $1 == "toolchain" { sub(/^go/, "", $2); toolchain = $2 }
            $1 == "go" { split($2, v, "."); go = v[1] "." v[2] ".x" }
            END { print (toolchain != "" ? toolchain : go) }
          ' native/yggdrasil_bridge/go.mod)
          test -n "$version"
          echo "Go $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # No caches: the file goes into a release (see release.yml, "No
      # caches in this workflow").
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false

      - name: Go bridge (static library for iPhone)
        run: sh native/yggdrasil_bridge/build_ios.sh iphoneos

      - name: Flutter packages
        run: flutter pub get --enforce-lockfile

      - name: Build (without signing)
        run: flutter build ios --release --no-codesign

      # The WebRTC framework CocoaPods downloaded (a zip from a GitHub
      # release, which CocoaPods never checks) against the hash pinned in
      # tool/ci/webrtc_sdk.sha256; a release build fails without a pin.
      - name: WebRTC framework (pinned SHA-256)
        run: |
          if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            python3 tool/ci/check_webrtc_sdk.py --strict ios/Pods
          else
            python3 tool/ci/check_webrtc_sdk.py ios/Pods
          fi

      # Once ios/Podfile.lock is committed the build must use exactly its
      # pods (without it CocoaPods resolves them anew on every build); until
      # then this build's file is kept as the artifact podfile-lock-ios,
      # to be committed.
      - name: Pods as locked (ios/Podfile.lock)
        run: |
          if git ls-files --error-unmatch ios/Podfile.lock > /dev/null 2>&1; then
            if ! git diff --exit-code -I '^COCOAPODS:' -- ios/Podfile.lock; then
              echo "::error::The build resolved other pods than the committed ios/Podfile.lock."
              exit 1
            fi
          else
            echo "::warning::ios/Podfile.lock is not committed: the pods are resolved anew on every build. Commit the file of the artifact podfile-lock-ios."
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: podfile-lock-ios
          path: ios/Podfile.lock
          if-no-files-found: warn

      - name: Package Zen-unsigned.ipa
        run: |
          rm -rf build/ipa build/Zen-unsigned.ipa
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../Zen-unsigned.ipa Payload)
          (cd build && shasum -a 256 Zen-unsigned.ipa | tee Zen-unsigned.ipa.sha256)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Zen-unsigned-ipa
          path: |
            build/Zen-unsigned.ipa
            build/Zen-unsigned.ipa.sha256
          if-no-files-found: error
