# iPhone build without signing: Zen-unsigned.ipa for SideStore / AltStore
# (README, section "iPhone"). Runs by hand (Actions -> iOS -> Run workflow)
# and for version tags (v*). A tag also attaches the file to that tag's
# GitHub release; when there is no release yet, a draft is created.
# See docs/WYDANIA.md.
name: iOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same Flutter as the Android / Windows builds (pubspec.lock: >= 3.44).
  FLUTTER_VERSION: '3.47.1'

jobs:
  ipa:
    name: Zen-unsigned.ipa
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Go version from go.mod
        id: go
        run: |
          version=$(awk '$1 == "go" { split($2, v, "."); print v[1] "." v[2] ".x" }' native/yggdrasil_bridge/go.mod)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-dependency-path: native/yggdrasil_bridge/go.sum

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Go bridge (static library for iPhone)
        run: sh native/yggdrasil_bridge/build_ios.sh iphoneos

      - name: Flutter packages
        run: flutter pub get

      - name: Build (without signing)
        run: flutter build ios --release --no-codesign

      - name: Package Zen-unsigned.ipa
        run: |
          rm -rf build/ipa build/Zen-unsigned.ipa
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../Zen-unsigned.ipa Payload)
          (cd build && shasum -a 256 Zen-unsigned.ipa | tee Zen-unsigned.ipa.sha256)

      - uses: actions/upload-artifact@v6
        with:
          name: Zen-unsigned-ipa
          path: |
            build/Zen-unsigned.ipa
            build/Zen-unsigned.ipa.sha256
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" build/Zen-unsigned.ipa --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" build/Zen-unsigned.ipa --draft --title "$TAG" \
              --notes "Wersja robocza z workflow iOS. Dodaj Zen.apk, Zen-Windows.zip i SHA256SUMS (z sumą Zen-unsigned.ipa), potem opublikuj." \
              --repo "$GITHUB_REPOSITORY"
          fi
