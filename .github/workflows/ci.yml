# Every push to main and every pull request: format, analysis and all tests
# of the app, and the Go bridge's own tests. Runs on Windows, like the
# maintainer's machine (docs/TESTING.md). Next to them the Go bridge for
# the three Android ABIs, the Linux, Windows on ARM and macOS builds (the Go
# bridge builds itself inside them), the Linux packaging and a short start
# of each app. Actions are pinned to commit SHAs (Dependabot updates them,
# .github/dependabot.yml); the token is read-only and no secret is used.
# The test jobs write a short report (format, analyzer, test counts, failed
# tests) to the run's summary page with tool/ci/ci_summary.py.
# Linux runners are pinned to an image (as in release.yml): the Linux build
# runs on Ubuntu 22.04 like the release, its .deb is installed on the
# systems the README promises, and govulncheck looks for known
# vulnerabilities in the Go bridge's dependencies and Go itself.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.1'

jobs:
  app:
    name: Analyze and test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Packages
        run: flutter pub get --enforce-lockfile

      - name: Format
        id: format
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        id: analyze
        run: flutter analyze | Tee-Object -FilePath analyze.log

      # The usual output in the log, and the JSON events in a file for the
      # summary below.
      - name: Test
        id: test
        run: flutter test --file-reporter json:test-results.json

      # The release workflow makes every file the app updates from, and the
      # install page and the SideStore source point to them
      # (tool/release.dart, tool/ci/test_release_source.py).
      - name: Release contract
        run: |
          dart run tool/release.dart check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tool/ci/test_release_source.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tool/ci/test_ci_checks.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tool/ci/test_check_libwebrtc.py

      # Format, analyzer and test counts (with the failed tests) on the
      # run's summary page; tool/ci/ci_summary.py never fails the job.
      - name: Summary
        if: ${{ !cancelled() }}
        shell: bash
        run: >-
          python tool/ci/ci_summary.py flutter
          --format '${{ steps.format.outcome }}'
          --analyze '${{ steps.analyze.outcome }}' --analyze-log analyze.log
          --test '${{ steps.test.outcome }}' --tests test-results.json

  go:
    name: Go bridge
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native/yggdrasil_bridge
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: native/yggdrasil_bridge/go.mod
          cache-dependency-path: native/yggdrasil_bridge/go.sum

      - name: Vet
        id: vet
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: go vet ./...

      - name: Test
        id: test
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: go test -count=1 -v ./... 2>&1 | tee go-test.log

      - name: Summary
        if: ${{ !cancelled() }}
        shell: bash
        run: >-
          python ../../tool/ci/ci_summary.py go
          --vet '${{ steps.vet.outcome }}'
          --test '${{ steps.test.outcome }}' --log go-test.log

  govulncheck:
    name: Go vulnerabilities (govulncheck)
    # Known vulnerabilities (vuln.go.dev) in the code the bridge really
    # calls, in its modules and in the Go toolchain of go.mod (its
    # `toolchain` line, which setup-go installs). Fails on any finding:
    # update the module (or the toolchain line) and refresh
    # LICENSES-GO.txt. Linux build tags; the Android, Windows and Apple
    # files use the same modules.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: native/yggdrasil_bridge
    env:
      GOVULNCHECK_VERSION: v1.8.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: native/yggdrasil_bridge/go.mod
          cache-dependency-path: native/yggdrasil_bridge/go.sum

      - name: govulncheck
        env:
          CGO_ENABLED: '1'
        run: |
          go version
          go run "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION" -show verbose ./...

  android-bridge:
    name: Go bridge for Android (3 ABIs)
    # The APK carries arm64-v8a, armeabi-v7a (32-bit) and x86_64: each must
    # build and export the bridge (a 32-bit-only break shows up here, not
    # on the maintainer's arm64 phone). The NDK is on the runner. Each
    # 64-bit library must work with 16 KB pages (Google Play, Android 15+).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: native/yggdrasil_bridge/go.mod
          cache-dependency-path: native/yggdrasil_bridge/go.sum

      - name: Build
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          sh native/yggdrasil_bridge/build_android.sh
          nm="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          readelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            lib="android/app/src/main/jniLibs/$abi/libyggdrasil_bridge.so"
            "$nm" -D --defined-only "$lib" | grep -q ' YggStartNode$'
            ls -l "$lib"
            "$readelf" -l "$lib" | grep -E '^\s*LOAD'
          done
          python3 tool/ci/check_page_alignment.py android/app/src/main/jniLibs

  linux:
    name: Linux build
    # As the release: Ubuntu 22.04 (glibc 2.35), the oldest system the
    # Linux files support.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Flutter's Linux toolchain; libsecret for flutter_secure_storage,
      # the app indicator for system_tray, GStreamer for audio and video;
      # PulseAudio's headers for call recording;
      # make and g++ build Zen's own H.264 encoder (OpenH264, from source);
      # Xvfb for the start below; dpkg-dev for the .deb.
      - name: Build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            make g++ \
            libstdc++-12-dev libsecret-1-dev libayatana-appindicator3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpulse-dev \
            xvfb libgl1-mesa-dri libglx-mesa0 \
            dpkg-dev

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: native/yggdrasil_bridge/go.mod
          cache-dependency-path: native/yggdrasil_bridge/go.sum

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Packages
        run: flutter pub get --enforce-lockfile

      - name: Build (the Go bridge builds itself)
        run: flutter build linux --release

      - name: Go bridge and media player in the bundle
        run: |
          bridge=build/linux/x64/release/bundle/lib/libyggdrasil_bridge.so
          nm -D --defined-only "$bridge" | grep ' YggStartNode$'
          ldd build/linux/x64/release/bundle/zen | grep 'libgstreamer-1.0'

      # No binary may need a newer glibc / libstdc++ than Ubuntu 22.04's.
      - name: glibc baseline and libraries
        run: |
          sh tool/ci/check_linux_abi.sh build/linux/x64/release/bundle 2.35 3.4.30
          # The prebuilt libwebrtc flutter_webrtc downloaded, against the
          # SHA-256 pinned in tool/ci/libwebrtc.sha256.
          python3 tool/ci/check_libwebrtc.py linux-x64 build/linux/x64/release/bundle

      - name: Package (.deb)
        run: |
          mkdir -p deb
          sh linux/packaging/build_deb.sh build/linux/x64/release/bundle x64 deb/zen.deb
          dpkg-deb --info deb/zen.deb

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-linux-deb
          path: deb/zen.deb
          retention-days: 3
          if-no-files-found: error

      - name: Start (still running after 20 seconds)
        run: |
          status=0
          timeout --kill-after=10 20 xvfb-run -a build/linux/x64/release/bundle/zen || status=$?
          if [ "$status" -ne 124 ] && [ "$status" -ne 137 ]; then
            echo "::error::zen stopped with status $status within 20 seconds"
            exit 1
          fi

  packaging:
    name: Linux packaging metadata
    # The validators of a current system (the build above runs on an older
    # one, whose appstream knows fewer rules).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils appstream

      - name: .desktop and AppStream
        run: |
          desktop-file-validate linux/packaging/com.roj.zen.desktop
          appstreamcli validate --no-net linux/packaging/com.roj.zen.metainfo.xml

  deb-install:
    name: .deb on ${{ matrix.image }}
    # The README promises Debian, Ubuntu and Mint: the .deb built on Ubuntu
    # 22.04 must install there (its dependencies resolve, the t64 library
    # names of newer systems included) and find every library it links.
    # Only the dependencies, not the recommended packages.
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'ubuntu:26.04', 'debian:12', 'debian:13']
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-linux-deb
          path: deb

      - name: Install and look for missing libraries
        env:
          DEBIAN_FRONTEND: noninteractive
          IMAGE: ${{ matrix.image }}
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ./deb/zen.deb
          # The bundle's own libraries find each other through /opt/zen/lib.
          missing=$(LD_LIBRARY_PATH=/opt/zen/lib ldd /opt/zen/zen /opt/zen/lib/*.so \
            | grep 'not found' || true)
          if [ -n "$missing" ]; then
            echo "::error::Missing libraries on $IMAGE:"
            echo "$missing"
            exit 1
          fi
          echo "Zen installs on $IMAGE."

  windows-arm64:
    name: Windows on ARM build
    # As the macOS job: pushes to main and runs by hand only. Not required
    # (continue-on-error) until it has passed once; see release.yml.
    if: github.event_name != 'pull_request'
    runs-on: windows-11-arm
    timeout-minutes: 75
    continue-on-error: true
    env:
      LLVM_MINGW_VERSION: '20251021'
      LLVM_MINGW_SHA256: d31dd2799c18440acb7cc13b03cadfc3069dff48168cd406a44930e965b09655
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: native/yggdrasil_bridge/go.mod
          cache-dependency-path: native/yggdrasil_bridge/go.sum

      - name: C compiler for cgo (llvm-mingw, checked against its SHA-256)
        shell: pwsh
        run: |
          $name = "llvm-mingw-$env:LLVM_MINGW_VERSION-ucrt-aarch64"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest -UseBasicParsing -OutFile $zip `
            -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_VERSION/$name.zip"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($hash -ne $env:LLVM_MINGW_SHA256) {
            throw "llvm-mingw: SHA-256 $hash, expected $env:LLVM_MINGW_SHA256"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP "$name\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false

      - name: Packages
        run: flutter pub get --enforce-lockfile

      - name: Build
        run: flutter build windows --release

      - name: Go bridge in the app
        shell: pwsh
        run: |
          if (-not (Test-Path build/windows/arm64/runner/Release/yggdrasil_bridge.dll)) {
            throw 'The ARM64 build has no Go bridge'
          }

  macos:
    name: macOS build
    # macOS runners cost ten times the Linux minutes (on private
    # repositories) and queue longer, so pull requests skip this job: a
    # push to main still catches a macOS break at once, and
    # Actions -> CI -> Run workflow checks any branch by hand.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: native/yggdrasil_bridge/go.mod
          cache-dependency-path: native/yggdrasil_bridge/go.sum

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # As in the iOS workflow: built before Xcode starts, whose build
      # phase then finds it up to date.
      - name: Go bridge (universal static library)
        run: sh native/yggdrasil_bridge/build_macos.sh

      - name: Packages
        run: flutter pub get --enforce-lockfile

      - name: Build
        run: flutter build macos --release

      - name: Go bridge in the app
        run: |
          nm -gU build/macos/Build/Products/Release/Zen.app/Contents/MacOS/Zen \
            | grep ' _YggStartNode$'

      - name: Start (still running after 20 seconds)
        run: |
          build/macos/Build/Products/Release/Zen.app/Contents/MacOS/Zen &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2> /dev/null; then
            status=0
            wait "$pid" || status=$?
            echo "::error::Zen stopped with status $status within 20 seconds"
            exit 1
          fi
          kill "$pid"
