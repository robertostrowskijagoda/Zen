  };
  var LINKS = {
    ios: "https://robertostrowskijagoda.github.io/Zen/install/#iphone",
    help: "https://github.com/robertostrowskijagoda/Zen",
    support: "https://buycoffee.to/zen"
  };
  var RTL = { ar: true };
  var ALIASES = { "in": "id", "iw": "he", "nb": "en", "no": "en" };

  var $ = function (id) { return document.getElementById(id); };

  function pickLanguage() {
    var wanted = [];
    var m = /(?:^|[?&])lang=([A-Za-z-]+)/.exec(location.search);
    if (m) { wanted.push(m[1]); }
    var list = navigator.languages && navigator.languages.length
      ? navigator.languages : [navigator.language || "en"];
    for (var i = 0; i < list.length; i++) { wanted.push(list[i]); }
    for (var j = 0; j < wanted.length; j++) {
      var base = String(wanted[j]).toLowerCase().split(/[-_]/)[0];
      base = ALIASES[base] || base;
      if (Object.prototype.hasOwnProperty.call(TEXTS, base)) { return base; }
    }
    return "en";
  }
  var lang = pickLanguage();
  var tx = TEXTS[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = RTL[lang] ? "rtl" : "ltr";
  document.title = tx.title;

  // Plain text with an optional [link] part; built from nodes, never HTML.
  function setLinked(el, text, href) {
    el.textContent = "";
    var a = text.indexOf("["), b = text.indexOf("]");
    if (a < 0 || b < a) { el.textContent = text; return; }
    el.appendChild(document.createTextNode(text.slice(0, a)));
    var link = document.createElement("a");
    link.href = href;
    link.textContent = text.slice(a + 1, b);
    el.appendChild(link);
    el.appendChild(document.createTextNode(text.slice(b + 1)));
  }
  function setNoApp(el) {
    el.textContent = "";
    var parts = tx.noApp.replace("{open}", tx.open).split("{path}");
    el.appendChild(document.createTextNode(parts[0]));
    if (parts.length > 1) {
      var bold = document.createElement("b");
      bold.textContent = tx.path;
      el.appendChild(bold);
      el.appendChild(document.createTextNode(parts[1]));
    }
  }

  var page = location.origin + location.pathname;
  var ua = navigator.userAgent || "";
  var android = /Android/i.test(ua);
  var ios = /iPhone|iPad|iPod/i.test(ua) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var raw = decodeURIComponent((location.hash || "").replace(/^#/, ""));
  // Only an invitation code (Crockford base32, dashes optional) is taken.
  var code = raw.toUpperCase().replace(/[^0-9A-Z]/g, "");
  if (!/^[0-9A-HJKMNP-TV-Z]{25}$/.test(code)) { code = ""; }
  var noApp = /(^|[?&])noapp=1(&|$)/.test(location.search);

  $("lead").textContent = tx.lead;
  $("open").textContent = tx.open;
  $("copy").textContent = tx.copy;
  $("android").textContent = tx.android;
  $("otherPhones").textContent = tx.otherPhones || TEXTS.en.otherPhones;
  $("windows").textContent = tx.windows;
  setLinked($("ios"), tx.ios, LINKS.ios);
  setLinked($("help"), tx.help, LINKS.help);
  setLinked($("support"), tx.support, LINKS.support);
  setNoApp($("noapp"));

  var target = code ? "c/" + code : "inbox";
  var openUrl;
  if (android) {
    var fallback = page + "?noapp=1" + (code ? "#" + code : "");
    openUrl = "intent://" + target + "#Intent;scheme=zen;package=com.roj.zen;" +
      "S.browser_fallback_url=" + encodeURIComponent(fallback) + ";end";
  } else {
    openUrl = "zen://" + target;
  }
  $("open").href = openUrl;

  if (code) {
    $("title").textContent = tx.invTitle;
    $("lead").textContent = tx.invLead;
    $("code").textContent = code.match(/.{1,5}/g).join("-");
    $("code").classList.remove("hidden");
    $("copy").classList.remove("hidden");
    $("copy").addEventListener("click", function () {
      var text = $("code").textContent;
      var done = function () { $("copy").textContent = tx.copied; };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () {});
      }
    });
  }
  if (noApp) { $("noapp").classList.remove("hidden"); }
  if (ios) {
    $("ios").classList.remove("hidden");
    $("android").classList.add("hidden");
    $("otherAndroid").classList.add("hidden");
    $("windows").classList.add("hidden");
  } else if (android) {
    $("windows").classList.add("hidden");
  }
  // Straight into the app when it is there (Android: otherwise back here
  // with "noapp", where the downloads are).
  if (android && !noApp) {
    setTimeout(function () { location.href = openUrl; }, 150);
  }
})();
</script>
