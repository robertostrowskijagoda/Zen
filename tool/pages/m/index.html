<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Zen — neighbours</title>
<link rel="icon" type="image/png" href="../zen-icon.png">
<link rel="apple-touch-icon" href="../zen-icon.png">
<style>
  :root {
    --bg: #f6f4fb; --card: #ffffff; --text: #17151f; --muted: #5d5970;
    --accent: #7c4dff; --accent2: #c026d3; --line: #e4e0ef;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0a10; --card: #16141f; --text: #f3f1fa; --muted: #a6a1ba;
      --accent: #9d7bff; --accent2: #e15ee8; --line: #2a2738;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: flex-start; justify-content: center; padding: 16px;
  }
  main {
    width: 100%; max-width: 440px; background: var(--card);
    border: 1px solid var(--line); border-radius: 28px; padding: 28px 22px;
    text-align: center;
  }
  .logo {
    width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 20px;
    display: block; object-fit: cover; box-shadow: 0 0 0 1px var(--line);
  }
  h1 { font-size: 22px; margin: 4px 0 6px; }
  p { color: var(--muted); margin: 6px 0 14px; }
  .flat {
    font-weight: 700; color: var(--text); background: var(--bg);
    border: 1px dashed var(--line); border-radius: 14px; padding: 12px 8px;
    margin: 8px 0 16px; word-break: break-word;
  }
  a.btn, button.btn {
    display: block; width: 100%; padding: 14px 16px; margin: 10px 0 0;
    border-radius: 16px; border: 0; font: 700 16px/1.2 inherit;
    text-decoration: none; cursor: pointer;
  }
  .primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
  /* "Open in Zen": the first thing on the page, as big as a thumb wants. */
  a.btn.open {
    display: flex; align-items: center; justify-content: center;
    min-height: 112px; margin: 0 0 22px; padding: 22px 18px;
    border-radius: 26px; font: 800 30px/1.15 inherit;
    box-shadow: 0 10px 28px rgba(124, 77, 255, .35);
  }
  .other { margin: 6px 0 0; }
  .secondary { background: var(--bg); color: var(--text); border: 1px solid var(--line) !important; }
  .small { font-size: 13.5px; color: var(--muted); margin-top: 18px; }
  .small a { color: var(--accent); }
  .hidden { display: none; }
  .lang { position: absolute; top: 12px; right: 16px; }
  .lang button {
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 10px; padding: 4px 10px; cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 600; line-height: 1.4;
  }
  .lang button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
</style>
</head>
<body>
<div class="lang" role="group" aria-label="Language">
  <button type="button" data-lang="en">EN</button>
  <button type="button" data-lang="pl">PL</button>
</div>
<main>
  <a id="open" class="btn primary open" href="#"></a>
  <img class="logo" src="../zen-icon.png" width="64" height="64" alt="Zen">
  <h1 id="title"></h1>
  <p id="lead"></p>
  <div id="flat" class="flat hidden"></div>
  <p id="noapp" class="hidden"></p>
  <button id="copy" class="btn secondary hidden" type="button"></button>
  <a id="android" class="btn secondary" href="https://github.com/robertostrowskijagoda/Zen/releases/latest/download/Zen-arm64-v8a.apk"></a>
  <p id="otherAndroid" class="small other"><span id="otherPhones"></span>
    <a href="https://github.com/robertostrowskijagoda/Zen/releases/latest/download/Zen-armeabi-v7a.apk">armeabi-v7a</a> ·
    <a href="https://github.com/robertostrowskijagoda/Zen/releases/latest/download/Zen-x86_64.apk">x86_64</a></p>
  <a id="windows" class="btn secondary" href="https://github.com/robertostrowskijagoda/Zen/releases/latest/download/Zen-Windows.zip"></a>
  <p id="ios" class="small hidden"></p>
  <p class="small"><a id="project" href="https://github.com/robertostrowskijagoda/Zen"></a></p>
</main>
<script>
(function () {
  "use strict";
  // Door-code page (/m#<code>). Every visible text lives in TEXTS, so the
  // page can be translated by adding a language object (the code never
  // leaves the phone: it stays after the "#").
  var TEXTS = {
    en: {
      title: "Your neighbours are on Zen",
      lead: "This is the code from a neighbour's door. Open it in Zen to say hello; the code holds the flat, not the people who live there.",
      leadBad: "This link does not hold a valid door code. Scan the sticker on the door again.",
      flat: "Flat: ",
      open: "Open in Zen",
      copy: "Copy the door code",
      copied: "Copied ✓",
      noapp: "It looks like Zen is not installed yet. Install it (buttons below), then come back here and tap “Open in Zen” — or in Zen open Neighbours → Scan a door code and paste the copied code.",
      android: "⬇ Download for Android",
      otherPhones: "Other phones:",
      windows: "⬇ Download for Windows",
      ios: "iPhone: Zen installs through SideStore — see the project page.",
      project: "How to install, and how to check it is safe: the project page on GitHub"
    },
    pl: {
      title: "Twoi sąsiedzi są w Zen",
      lead: "To kod z drzwi sąsiada. Otwórz go w Zen, żeby się przywitać; kod zawiera mieszkanie, nie ludzi, którzy tam mieszkają.",
      leadBad: "Ten link nie zawiera poprawnego kodu z drzwi. Zeskanuj naklejkę jeszcze raz.",
      flat: "Mieszkanie: ",
      open: "Otwórz w Zen",
      copy: "Skopiuj kod z drzwi",
      copied: "Skopiowano ✓",
      noapp: "Wygląda na to, że nie masz jeszcze Zen. Zainstaluj go (przyciski niżej), wróć tutaj i stuknij „Otwórz w Zen” — albo w Zen wejdź w Sąsiedzi → Zeskanuj kod z drzwi i wklej skopiowany kod.",
      android: "⬇ Pobierz na Androida",
      otherPhones: "Inne telefony:",
      windows: "⬇ Pobierz na Windows",
      ios: "iPhone: Zen instaluje się przez SideStore — zobacz stronę projektu.",
      project: "Jak zainstalować i sprawdzić, że to bezpieczne: strona projektu na GitHubie"
    }
  };
  var STORE_KEY = "zen-lang";
  var $ = function (id) { return document.getElementById(id); };
  var hasText = function (l) {
    return Object.prototype.hasOwnProperty.call(TEXTS, l);
  };
  // Language: "?lang=xx", then the visitor's earlier choice (the storage
  // may be blocked), then the browser's languages; English otherwise.
  function pickLanguage() {
    var wanted = [];
    var m = /(?:^|[?&])lang=([A-Za-z-]+)/.exec(location.search);
    if (m) { wanted.push(m[1]); }
    try {
      var saved = localStorage.getItem(STORE_KEY);
      if (saved) { wanted.push(saved); }
    } catch (e) { /* not remembered */ }
    var list = navigator.languages && navigator.languages.length
      ? navigator.languages : [navigator.language || "en"];
    for (var i = 0; i < list.length; i++) { wanted.push(list[i]); }
    for (var j = 0; j < wanted.length; j++) {
      var base = String(wanted[j]).toLowerCase().split(/[-_]/)[0];
      if (hasText(base)) { return base; }
    }
    return "en";
  }
  var lang = pickLanguage();
  var T = TEXTS[lang];

  var ua = navigator.userAgent || "";
  var android = /Android/i.test(ua);
  var ios = /iPhone|iPad|iPod/i.test(ua) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var noApp = /(^|[?&])noapp=1(&|$)/.test(location.search);
  var page = location.origin + location.pathname;

  // The hash is the base64url door code; only its shape and the flat name
  // are read here. Addresses (if an old sticker has them) are never shown.
  var code = (location.hash || "").replace(/^#/, "").replace(/^zen-flat:/, "");
  var name = "";
  if (/^[A-Za-z0-9_-]{16,2000}$/.test(code)) {
    try {
      var b64 = code.replace(/-/g, "+").replace(/_/g, "/");
      while (b64.length % 4) { b64 += "="; }
      var bytes = atob(b64);
      var json = JSON.parse(decodeURIComponent(bytes.split("").map(function (c) {
        return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
      }).join("")));
      if (json && typeof json.k === "string" && typeof json.d === "string") {
        name = typeof json.n === "string" ? json.n.slice(0, 150) : "";
      } else { code = ""; }
    } catch (e) { code = ""; }
  } else { code = ""; }

  // All translated texts; run again when the visitor picks another language.
  function applyLanguage() {
    document.documentElement.lang = lang;
    document.title = T.title;
    $("title").textContent = T.title;
    $("lead").textContent = code ? T.lead : T.leadBad;
    $("open").textContent = T.open;
    $("copy").textContent = T.copy;
    $("android").textContent = T.android;
    $("otherPhones").textContent = T.otherPhones;
    $("windows").textContent = T.windows;
    $("ios").textContent = T.ios;
    $("noapp").textContent = T.noapp;
    $("project").textContent = T.project;
    if (code && name) { $("flat").textContent = T.flat + name; }
    Array.prototype.forEach.call(document.querySelectorAll(".lang button"), function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-lang") === lang ? "true" : "false");
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll(".lang button"), function (b) {
    b.addEventListener("click", function () {
      var l = b.getAttribute("data-lang");
      if (!hasText(l)) { return; }
      lang = l;
      T = TEXTS[lang];
      try { localStorage.setItem(STORE_KEY, lang); } catch (e) { /* not remembered */ }
      applyLanguage();
    });
  });
  applyLanguage();

  if (!code) {
    $("open").classList.add("hidden");
    $("copy").classList.add("hidden");
  } else {
    if (name) {
      $("flat").classList.remove("hidden");
    }
    var target = "m/" + code;
    var openUrl;
    if (android) {
      var fallback = page + "?noapp=1#" + code;
      openUrl = "intent://" + target + "#Intent;scheme=zen;package=com.roj.zen;" +
        "S.browser_fallback_url=" + encodeURIComponent(fallback) + ";end";
    } else {
      openUrl = "zen://" + target;
    }
    $("open").href = openUrl;
    $("copy").classList.remove("hidden");
    $("copy").addEventListener("click", function () {
      var text = "zen-flat:" + code;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          $("copy").textContent = T.copied;
        }, function () {});
      }
    });
    if (android && !noApp) {
      setTimeout(function () { location.href = openUrl; }, 150);
    }
  }
  if (noApp) { $("noapp").classList.remove("hidden"); }
  if (ios) {
    $("ios").classList.remove("hidden");
    $("android").classList.add("hidden");
    $("otherAndroid").classList.add("hidden");
    $("windows").classList.add("hidden");
  } else if (android) {
    $("windows").classList.add("hidden");
  }
})();
</script>
</body>
</html>
