<style>
  /* Shared look of all the Zen pages (the same block is inlined in each page). */
  :root {
    color-scheme: light dark;
    --bg: #f6f4fb; --card: #ffffff; --text: #17151f; --muted: #5d5970;
    --line: #e4e0ef; --soft: #efeaff; --link: #6234d8; --focus: #6234d8;
    --btn1: #6d3df5; --btn2: #b01fc4; --bar: rgba(246, 244, 251, .88);
    --glow: rgba(124, 77, 255, .20); --warn: #9a5b00;
    --shadow: 0 1px 2px rgba(23, 21, 31, .05), 0 10px 28px rgba(70, 40, 140, .08);
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0a10; --card: #16141f; --text: #f3f1fa; --muted: #a6a1ba;
      --line: #2a2738; --soft: #221d36; --link: #b9a2ff; --focus: #c4b0ff;
      --bar: rgba(11, 10, 16, .88); --glow: rgba(157, 123, 255, .22);
      --warn: #f0b45a;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 16px/1.55 var(--font);
  }
  img { max-width: 100%; }
  h1, h2, h3 { line-height: 1.2; }
  p { margin: 8px 0 14px; }
  a { color: var(--link); text-underline-offset: 3px; }
  a:hover { text-decoration-thickness: 2px; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
  code {
    font: 13.5px/1.5 var(--mono); background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 2px 6px; word-break: break-all;
  }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }

  /* Icons: one sprite per page, drawn with the text colour. */
  .ico {
    width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }
  .ico.fill { fill: currentColor; stroke: none; }

  /* Top bar: brand, links, language. */
  .top { position: relative; z-index: 20; background: var(--bar); border-bottom: 1px solid var(--line); }
  @media (min-width: 720px) {
    .top { position: sticky; top: 0; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  }
  .top-in {
    max-width: 1040px; margin: 0 auto; padding: 10px 16px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
  }
  .brand {
    order: 1; margin-inline-end: auto; display: inline-flex; align-items: center; gap: 10px;
    color: var(--text); font-weight: 800; font-size: 19px; text-decoration: none;
  }
  .brand img { width: 32px; height: 32px; border-radius: 9px; display: block; box-shadow: 0 0 0 1px var(--line); }
  .topnav { order: 3; width: 100%; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
  .topnav a {
    display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 0 12px;
    border-radius: 999px; color: var(--text); font-weight: 600; font-size: 15px;
    text-decoration: none; white-space: nowrap;
  }
  .topnav a:hover { background: var(--soft); }
  .topnav a[aria-current="page"] { background: var(--soft); color: var(--link); }
  .topnav .ico { width: 18px; height: 18px; display: none; }
  @media (max-width: 419px) { .topnav a { padding: 0 8px; font-size: 14.5px; } }
  @media (min-width: 520px) { .topnav .ico { display: block; } .topnav a { padding: 0 14px; } }
  @media (min-width: 720px) {
    .top-in { flex-wrap: nowrap; }
    .topnav { order: 2; width: auto; flex-wrap: nowrap; margin-inline-start: auto; }
    .langpick { order: 3; }
  }

  /* Language picker: a visible pill; the real select lies invisible on top. */
  .langpick {
    order: 2; position: relative; display: inline-flex; align-items: center; gap: 7px;
    min-height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--card); color: var(--text); font-weight: 700; font-size: 14.5px;
  }
  .langpick:hover { border-color: var(--link); background: var(--soft); }
  .langpick:focus-within { outline: 3px solid var(--focus); outline-offset: 3px; }
  .langpick .ico { width: 18px; height: 18px; }
  .langpick .chev { width: 14px; height: 14px; opacity: .7; }
  .langpick .lc { letter-spacing: .04em; }
  .langpick .ln { display: none; }
  @media (min-width: 420px) { .langpick .ln { display: inline; } }
  .langpick select {
    position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0;
    cursor: pointer; font: inherit; color: var(--text); background: var(--card);
  }

  /* Hero: the app icon, the name and one line about Zen. */
  .hero {
    position: relative; isolation: isolate; overflow: hidden; text-align: center;
    padding: 34px 16px 12px;
  }
  .hero::before {
    content: ""; position: absolute; z-index: -1; left: 50%; top: -120px;
    width: min(900px, 140%); height: 440px; transform: translateX(-50%);
    background: radial-gradient(closest-side, var(--glow), transparent);
  }
  .hero-icon {
    width: 96px; height: 96px; display: block; margin: 0 auto 16px; border-radius: 26px;
    box-shadow: 0 14px 34px rgba(109, 61, 245, .35), 0 0 0 1px var(--line);
  }
  .hero h1 { font-size: clamp(30px, 7vw, 46px); margin: 0 0 10px; letter-spacing: -.02em; }
  @supports ((-webkit-background-clip: text) or (background-clip: text)) {
    .hero h1 {
      background: linear-gradient(90deg, var(--btn1), var(--btn2));
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
    }
    @media (prefers-color-scheme: dark) {
      .hero h1 { background-image: linear-gradient(90deg, #b9a2ff, #f08af5); }
    }
  }
  .hero .lead {
    max-width: 34em; margin: 0 auto; color: var(--muted);
    font-size: clamp(17px, 3.6vw, 20px);
  }

  main { display: block; max-width: 1040px; margin: 0 auto; padding: 18px 16px 24px; }

  /* Buttons and link chips. */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 48px; padding: 12px 20px; border-radius: 14px; border: 1px solid transparent;
    font: 700 16px/1.2 var(--font); text-align: center; text-decoration: none; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  @media (prefers-reduced-motion: no-preference) {
    .btn, .chip, .doc, .topnav a, .langpick {
      transition: transform .15s ease, box-shadow .15s ease, background-color .15s ease,
        border-color .15s ease, filter .15s ease;
    }
    .btn:hover, .doc:hover { transform: translateY(-2px); }
  }
  .btn:active, .doc:active { transform: translateY(1px) scale(.985); }
  .btn.primary {
    background: linear-gradient(135deg, var(--btn1), var(--btn2)); color: #fff;
    box-shadow: 0 8px 22px rgba(109, 61, 245, .32);
  }
  .btn.primary:hover { filter: brightness(1.1); box-shadow: 0 12px 28px rgba(109, 61, 245, .42); }
  .btn.secondary { background: var(--card); color: var(--text); border-color: var(--line); }
  .btn.secondary:hover { background: var(--soft); border-color: var(--link); }
  .btn.discord { background: #5865f2; color: #fff; box-shadow: 0 8px 22px rgba(88, 101, 242, .32); }
  .btn.discord:hover { filter: brightness(1.1); }
  .btn.block { display: flex; width: 100%; }
  .btn .ico { width: 22px; height: 22px; }
  /* "Open in Zen": the first thing in the page, as big as a thumb wants. */
  a.btn.open {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    width: 100%; max-width: 560px; min-height: 112px; margin: 6px auto 20px; padding: 20px 22px;
    border-radius: 26px; font: 800 30px/1.15 var(--font);
    box-shadow: 0 14px 34px rgba(109, 61, 245, .4);
  }
  a.btn.open .ico { width: 34px; height: 34px; stroke-width: 2.4; }
  @media (max-width: 380px) { a.btn.open { font-size: 24px; padding: 18px 14px; gap: 10px; } }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 5px 13px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--card);
    color: var(--link); font: 700 14.5px/1.2 var(--font); text-decoration: none;
  }
  .chip:hover { background: var(--soft); border-color: var(--link); }
  .chip.wrap { border-radius: 16px; text-align: center; }
  .chip .ico { width: 16px; height: 16px; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

  /* Cards and sections. */
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 22px;
    padding: 20px 18px; box-shadow: var(--shadow);
  }
  .card h2, .card h3 { margin: 0 0 6px; }
  .narrow { max-width: 560px; margin-inline: auto; }
  .sec { margin: 46px 0 0; }
  .sec > h2 { font-size: clamp(22px, 4.6vw, 30px); text-align: center; margin: 0 0 8px; }
  .sec > .sub { text-align: center; color: var(--muted); max-width: 36em; margin: 0 auto 22px; }
  .small { font-size: 14px; color: var(--muted); }
  .hint { text-align: center; color: var(--muted); font-size: 14.5px; margin: 12px 0 0; }
  .hint .chip { margin: 2px 2px; }

  /* Footer. */
  .foot {
    max-width: 1040px; margin: 36px auto 0; padding: 26px 16px 40px; text-align: center;
    border-top: 1px solid var(--line); color: var(--muted); font-size: 14px;
  }
  .foot-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 18px; margin: 0 0 14px; }
  .foot-links a { display: inline-flex; align-items: center; min-height: 32px; font-weight: 600; font-size: 15px; }
  .foot p { margin: 6px 0; }

  /* Blocks used by several pages. */
  .get h2 { font-size: 21px; }
  .get > p.muted { margin-top: 0; }
  .stack { display: grid; gap: 10px; margin-top: 14px; }
  .get .hint { margin-top: 10px; }
  .iosnote { background: var(--soft); border-radius: 14px; padding: 12px 14px; margin: 0; text-align: start; }
  .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); gap: 14px; }
  .feat { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; box-shadow: var(--shadow); }
  .feat .fi {
    width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center;
    background: var(--soft); color: var(--link); margin-bottom: 12px;
  }
  .feat .fi .ico { width: 24px; height: 24px; }
  .feat h3 { font-size: 18px; margin: 0 0 6px; }
  .feat p { margin: 0; color: var(--muted); font-size: 15px; }
  .shots {
    display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory;
    padding: 6px 4px 16px; margin: 0; list-style: none; justify-content: safe center;
  }
  .shots figure { margin: 0; flex: 0 0 190px; scroll-snap-align: center; text-align: center; font-size: 14.5px; font-weight: 600; color: var(--muted); }
  .shots img {
    display: block; width: 190px; height: auto; margin: 0 auto 8px; border-radius: 22px;
    border: 1px solid var(--line); box-shadow: var(--shadow); background: var(--card);
  }
  .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; list-style: none; margin: 0; padding: 0; counter-reset: s; }
  .steps li { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; counter-increment: s; }
  .steps li::before {
    content: counter(s); display: grid; place-items: center; width: 34px; height: 34px;
    margin-bottom: 10px; border-radius: 50%; color: #fff; font-weight: 800;
    background: linear-gradient(135deg, var(--btn1), var(--btn2));
  }
  .steps h3 { font-size: 17px; margin: 0 0 4px; }
  .steps p { margin: 0; color: var(--muted); font-size: 15px; }
  .cta-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .cta-row .btn { flex: 0 1 auto; }
  @media (max-width: 480px) { .cta-row .btn { width: 100%; } }

  /* Door-code page. */
  .invite { max-width: 560px; margin: 0 auto 18px; text-align: center; }
  .flat {
    font-weight: 700; font-size: 18px; background: var(--card); border: 2px dashed var(--link);
    border-radius: 16px; padding: 14px 12px; margin: 0 0 12px; word-break: break-word;
  }
  .noapp { background: var(--soft); border-radius: 14px; padding: 12px 14px; margin: 0 0 12px; text-align: start; }
</style>
</head>

    <a href="https://github.com/robertostrowskijagoda/Zen/blob/main/LICENSE" rel="noopener" data-i="footLicense">License</a>
  </div>
  <p data-i="footNote">Zen is free software (GPL-3.0). © 2026 Robert Ostrowski-Jagoda.</p>
</footer>
<script>
(function () {
  "use strict";
  // Door-code page (/m#<code>). Every visible text lives in TEXTS, so the
  // page can be translated by adding a language object (the code never
  // leaves the phone: it stays after the "#").
  var TEXTS = {
    en: {
      title: "Your neighbours are on Zen",
      lead: "This is the code from a neighbour's door. Open it in Zen to say hello; the code holds the flat, not the people who live there.",
      leadBad: "This link does not hold a valid door code. Scan the sticker on the door again.",
      flat: "Flat: ",
      open: "Open in Zen",
      copy: "Copy the door code",
      copied: "Copied ✓",
      noapp: "It looks like Zen is not installed yet. Install it (buttons below), then come back here and tap “Open in Zen” — or in Zen open Neighbours → Scan a door code and paste the copied code.",
      android: "⬇ Download for Android",
      otherPhones: "Other phones:",
      windows: "⬇ Download for Windows",
      ios: "iPhone: Zen installs through SideStore — see the project page.",
      project: "How to install, and how to check it is safe: the project page on GitHub",
      navAbout: "About",
      navInstall: "Install",
      getTitle: "Get Zen",
      getLead: "Free, no account, no ads. It takes a minute.",
      allInstall: "All installation options",
      footPrivacy: "Privacy policy",
      footTerms: "Terms of use",
      footLicense: "License",
      footNote: "Zen is free software (GPL-3.0). © 2026 Robert Ostrowski-Jagoda.",
      whatIsZen: "What is Zen?"
    },
    pl: {
      title: "Twoi sąsiedzi są w Zen",
      lead: "To kod z drzwi sąsiada. Otwórz go w Zen, żeby się przywitać; kod zawiera mieszkanie, nie ludzi, którzy tam mieszkają.",
      leadBad: "Ten link nie zawiera poprawnego kodu z drzwi. Zeskanuj naklejkę jeszcze raz.",
      flat: "Mieszkanie: ",
      open: "Otwórz w Zen",
      copy: "Skopiuj kod z drzwi",
      copied: "Skopiowano ✓",
      noapp: "Wygląda na to, że nie masz jeszcze Zen. Zainstaluj go (przyciski niżej), wróć tutaj i stuknij „Otwórz w Zen” — albo w Zen wejdź w Sąsiedzi → Zeskanuj kod z drzwi i wklej skopiowany kod.",
      android: "⬇ Pobierz na Androida",
      otherPhones: "Inne telefony:",
      windows: "⬇ Pobierz na Windows",
      ios: "iPhone: Zen instaluje się przez SideStore — zobacz stronę projektu.",
      project: "Jak zainstalować i sprawdzić, że to bezpieczne: strona projektu na GitHubie",
      navAbout: "O Zen",
      navInstall: "Instalacja",
      getTitle: "Pobierz Zen",
      getLead: "Za darmo, bez konta i reklam. Zajmie minutę.",
      allInstall: "Wszystkie sposoby instalacji",
      footPrivacy: "Polityka prywatności",
      footTerms: "Regulamin",
      footLicense: "Licencja",
      footNote: "Zen to wolne oprogramowanie (GPL-3.0). © 2026 Robert Ostrowski-Jagoda.",
      whatIsZen: "Czym jest Zen?"
    }
  };
  var STORE_KEY = "zen-lang";
  var $ = function (id) { return document.getElementById(id); };
  var hasText = function (l) {
    return Object.prototype.hasOwnProperty.call(TEXTS, l);
  };
  // Language: "?lang=xx", then the visitor's earlier choice (the storage
  // may be blocked), then the browser's languages; English otherwise.
  function pickLanguage() {
    var wanted = [];
    var m = /(?:^|[?&])lang=([A-Za-z-]+)/.exec(location.search);
    if (m) { wanted.push(m[1]); }
    try {
      var saved = localStorage.getItem(STORE_KEY);
      if (saved) { wanted.push(saved); }
    } catch (e) { /* not remembered */ }
    var list = navigator.languages && navigator.languages.length
      ? navigator.languages : [navigator.language || "en"];
    for (var i = 0; i < list.length; i++) { wanted.push(list[i]); }
    for (var j = 0; j < wanted.length; j++) {
      var base = String(wanted[j]).toLowerCase().split(/[-_]/)[0];
      if (hasText(base)) { return base; }
    }
    return "en";
  }
  var lang = pickLanguage();
  var T = TEXTS[lang];

  var ua = navigator.userAgent || "";
  var android = /Android/i.test(ua);
  var ios = /iPhone|iPad|iPod/i.test(ua) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var noApp = /(^|[?&])noapp=1(&|$)/.test(location.search);
  var page = location.origin + location.pathname;

  // The hash is the base64url door code; only its shape and the flat name
  // are read here. Addresses (if an old sticker has them) are never shown.
  var code = (location.hash || "").replace(/^#/, "").replace(/^zen-flat:/, "");
  var name = "";
  if (/^[A-Za-z0-9_-]{16,2000}$/.test(code)) {
    try {
      var b64 = code.replace(/-/g, "+").replace(/_/g, "/");
      while (b64.length % 4) { b64 += "="; }
      var bytes = atob(b64);
      var json = JSON.parse(decodeURIComponent(bytes.split("").map(function (c) {
        return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
      }).join("")));
      if (json && typeof json.k === "string" && typeof json.d === "string") {
        name = typeof json.n === "string" ? json.n.slice(0, 150) : "";
      } else { code = ""; }
    } catch (e) { code = ""; }
  } else { code = ""; }

  // Names of the languages in the picker, each in its own language.
  var NAMES = { en: "English", pl: "Polski" };
  // A text of the page: the visitor's language, else English.
  function tr(key) { return T[key] || TEXTS.en[key] || ""; }
  // A button label without its leading arrow (the icon replaces it).
  function label(s) { return s.replace(/^⬇\s*/, ""); }

  // All translated texts; run again when the visitor picks another language.
  function applyLanguage() {
    document.documentElement.lang = lang;
    document.title = T.title;
    $("title").textContent = T.title;
    $("lead").textContent = code ? T.lead : T.leadBad;
    $("openLabel").textContent = T.open;
    $("copyLabel").textContent = T.copy;
    $("androidLabel").textContent = label(T.android);
    $("otherPhones").textContent = T.otherPhones;
    $("windowsLabel").textContent = label(T.windows);
    $("ios").textContent = T.ios;
    $("noapp").textContent = T.noapp;
    $("project").textContent = T.project;
    if (code && name) { $("flat").textContent = T.flat + name; }
    Array.prototype.forEach.call(document.querySelectorAll("[data-i]"), function (el) {
      el.textContent = tr(el.getAttribute("data-i"));
    });
    $("langCode").textContent = lang.toUpperCase();
    $("langName").textContent = NAMES[lang] || lang;
    $("langSel").value = lang;
  }
  var picker = $("langSel");
  Object.keys(TEXTS).forEach(function (k) {
    var o = document.createElement("option");
    o.value = k;
    o.textContent = NAMES[k] || k;
    picker.appendChild(o);
  });
  picker.addEventListener("change", function () {
    if (!hasText(picker.value)) { return; }
    lang = picker.value;
    T = TEXTS[lang];
    try { localStorage.setItem(STORE_KEY, lang); } catch (e) { /* not remembered */ }
    applyLanguage();
  });
  applyLanguage();

  if (!code) {
    $("open").classList.add("hidden");
    $("copy").classList.add("hidden");
  } else {
    if (name) {
      $("flat").classList.remove("hidden");
    }
    var target = "m/" + code;
    var openUrl;
    if (android) {
      var fallback = page + "?noapp=1#" + code;
      openUrl = "intent://" + target + "#Intent;scheme=zen;package=com.roj.zen;" +
        "S.browser_fallback_url=" + encodeURIComponent(fallback) + ";end";
    } else {
      openUrl = "zen://" + target;
    }
    $("open").href = openUrl;
    $("copy").classList.remove("hidden");
    $("copy").addEventListener("click", function () {
      var text = "zen-flat:" + code;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          $("copyLabel").textContent = T.copied;
        }, function () {});
      }
    });
    if (android && !noApp) {
      setTimeout(function () { location.href = openUrl; }, 150);
    }
  }
  if (noApp) { $("noapp").classList.remove("hidden"); }
  if (ios) {
    $("ios").classList.remove("hidden");
    $("android").classList.add("hidden");
    $("otherAndroid").classList.add("hidden");
    $("windows").classList.add("hidden");
  } else if (android) {
    $("windows").classList.add("hidden");
  }
})();
</script>
</body>
